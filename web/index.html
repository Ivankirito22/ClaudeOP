<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-router</title>
<style>
:root {
  --bg: #0f1216; --panel: #161a20; --panel2: #1c2128; --line: #272d36; --text: #e6e9ee; --dim: #8b95a3; --faint: #5d6673;
  --accent: #6aa9ff; --accent-bg: #16294a; --ok: #4cc38a; --warn: #e5b94a; --bad: #ef6b6b;
  --haiku: #4cc38a; --sonnet: #5cc8e6; --opus: #c58af9;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f6f8; --panel: #ffffff; --panel2: #eef0f3; --line: #dcdfe5; --text: #1d2229; --dim: #5b6572; --faint: #8b94a1;
    --accent: #1f6feb; --accent-bg: #e3eeff; --ok: #1a8f5a; --warn: #a9740a; --bad: #c83b3b;
    --haiku: #1a8f5a; --sonnet: #0b84a5; --opus: #8a3fd1;
  }
}
:root[data-theme="light"] {
  --bg: #f5f6f8; --panel: #ffffff; --panel2: #eef0f3; --line: #dcdfe5; --text: #1d2229; --dim: #5b6572; --faint: #8b94a1;
  --accent: #1f6feb; --accent-bg: #e3eeff; --ok: #1a8f5a; --warn: #a9740a; --bad: #c83b3b;
  --haiku: #1a8f5a; --sonnet: #0b84a5; --opus: #8a3fd1;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app { height: 100%; display: grid; grid-template-columns: 272px minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); grid-template-areas: "top top" "banner banner" "side main"; }
.top { grid-area: top; } .banner { grid-area: banner; } .side { grid-area: side; } .main { grid-area: main; }

/* Barra superior */
.top { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); min-height: 48px; }
.brand { font-weight: 650; letter-spacing: .2px; }
.proj { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--line); background: var(--panel2); border-radius: 999px; font-size: 13px; white-space: nowrap; }
button.chip:hover { border-color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
.live { min-width: 120px; justify-content: center; }
.live.busy { border-color: var(--accent); background: var(--accent-bg); }
.live .spin { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.t-haiku { color: var(--haiku); } .t-sonnet { color: var(--sonnet); } .t-opus { color: var(--opus); }
#menuBtn { display: none; }

/* Aviso de actualización / conexión */
.banner { display: none; align-items: center; gap: 10px; padding: 7px 14px; background: var(--accent-bg); border-bottom: 1px solid var(--line); font-size: 13px; }
.banner.show { display: flex; }
.banner.bad { background: color-mix(in srgb, var(--bad) 18%, var(--panel)); }
.banner button { border: 1px solid var(--accent); background: transparent; border-radius: 6px; padding: 3px 10px; }

/* Menú */
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.search { padding: 10px; }
.search input { width: 100%; padding: 8px 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; color: var(--text); font: inherit; }
.menu { overflow: auto; padding: 0 6px 12px; flex: 1; }
.grp { margin-top: 2px; }
.grp > button { width: 100%; text-align: left; background: none; border: 0; padding: 7px 8px; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; display: flex; gap: 6px; border-radius: 6px; }
.grp > button:hover { background: var(--panel2); color: var(--text); }
.grp > button .car { width: 10px; transition: transform .12s; display: inline-block; }
.grp.open > button .car { transform: rotate(90deg); }
.grp .items { display: none; }
.grp.open .items { display: block; }
.item { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px 7px 22px; border-radius: 6px; color: var(--text); }
.item:hover { background: var(--panel2); }
.item:active { background: var(--accent-bg); }
.item:disabled { opacity: .45; cursor: default; }
.searching .item { padding-left: 10px; }
.empty { color: var(--faint); padding: 12px; font-size: 13px; }

/* Zona principal */
.main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
.stats { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--dim); }
.stats b { color: var(--text); font-weight: 600; }
.stats .warnlink { color: var(--warn); background: none; border: 0; padding: 0; text-decoration: underline dotted; }
.ctxbar { display: inline-block; width: 56px; height: 5px; background: var(--panel2); border-radius: 3px; vertical-align: middle; margin-left: 5px; overflow: hidden; }
.ctxbar i { display: block; height: 100%; background: var(--ok); }
.chatwrap { position: relative; min-height: 0; display: flex; }
.chat { flex: 1; overflow: auto; padding: 14px 18px 24px; font: 13.5px/1.5 var(--mono); }
.tools-toggle { position: absolute; right: 14px; top: 8px; z-index: 2; font: 12px var(--sans); border: 1px solid var(--line); background: var(--panel); color: var(--dim); border-radius: 999px; padding: 3px 10px; }
.tools-toggle[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.e { white-space: pre-wrap; word-break: break-word; margin: 0; }
.e.user { margin: 14px 0 6px; padding: 8px 12px; background: var(--accent-bg); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; font-family: var(--sans); font-size: 14px; }
.e.head { margin-top: 10px; font: 600 12px var(--sans); letter-spacing: .2px; }
.e.tool { display: none; color: var(--faint); font-size: 12px; padding-left: 6px; }
.show-tools .e.tool { display: block; }
.e.sep { color: var(--faint); font-size: 12px; margin: 8px 0 4px; border-top: 1px dashed var(--line); padding-top: 6px; }
.e.deleg { padding-left: 8px; font-size: 12.5px; }
.e.text { padding-left: 8px; }
.c-green { color: var(--haiku); } .c-cyan { color: var(--sonnet); } .c-magenta { color: var(--opus); }
.c-yellow { color: var(--warn); } .c-red { color: var(--bad); } .c-gray { color: var(--dim); } .c-white { color: var(--text); }
.b { font-weight: 650; }
.hello { color: var(--dim); font: 14px var(--sans); max-width: 560px; margin: 30px auto; text-align: center; }

/* Entrada */
.composer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 14px 12px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.quick button { border: 1px solid var(--line); background: var(--panel2); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.quick button:hover:not(:disabled) { border-color: var(--accent); }
.quick button:disabled { opacity: .45; cursor: default; }
.pending { display: none; align-items: center; gap: 8px; margin-bottom: 8px; padding: 6px 10px; border-radius: 8px; background: var(--accent-bg); border: 1px solid var(--accent); font-size: 13px; }
.pending.show { display: flex; }
.pending button { margin-left: auto; background: none; border: 0; color: var(--dim); font-size: 16px; line-height: 1; }
.row { display: flex; gap: 8px; align-items: flex-end; }
textarea { flex: 1; resize: none; max-height: 200px; min-height: 42px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: 14px/1.4 var(--sans); }
.send { border: 0; border-radius: 10px; padding: 0 20px; height: 42px; background: var(--accent); color: #fff; font-weight: 600; }
.send.cancel { background: var(--bad); }
.hint { margin-top: 6px; color: var(--faint); font-size: 12px; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "banner" "main"; }
  .top { flex-wrap: wrap; gap: 6px; padding: 6px 10px; }
  .chip { padding: 4px 9px; font-size: 12px; }
  .brand { font-size: 13px; }
  .side { position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; width: 82%; max-width: 320px; transform: translateX(-102%); transition: transform .18s; box-shadow: 4px 0 24px rgba(0,0,0,.4); }
  .side.open { transform: none; }
  #menuBtn { display: inline-flex; }
  .proj { display: none; }
  .live { min-width: 0; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="chip" id="menuBtn" aria-label="Abrir el menú de acciones">☰ Acciones</button>
    <span class="brand">claude-router</span>
    <span class="proj" id="proj"></span>
    <span class="spacer"></span>
    <button class="chip hide-sm" id="chipProfile" title="Cambiar perfil (Económico / Equilibrado / Calidad)"></button>
    <button class="chip hide-sm" id="chipPerm" title="Cambiar el modo de permisos"></button>
    <button class="chip" id="chipAuth" title="Login / estado de la sesión de Claude"></button>
    <span class="chip live" id="live"></span>
  </header>

  <div class="banner" id="banner"></div>

  <nav class="side" id="side" aria-label="Acciones">
    <div class="search"><input id="q" type="search" placeholder="Buscar acción…  (Ctrl+K)" autocomplete="off"></div>
    <div class="menu" id="menu"></div>
  </nav>

  <main class="main">
    <div class="stats" id="stats"></div>
    <div class="chatwrap" id="chatwrap">
      <button class="tools-toggle" id="toolsToggle" aria-pressed="false" title="Mostrar u ocultar las líneas de herramientas (⚙)">detalle</button>
      <div class="chat" id="chat" aria-live="polite"></div>
    </div>
    <div class="composer">
      <div class="quick" id="quick"></div>
      <div class="pending" id="pending"><span id="pendingText"></span><button id="pendingX" aria-label="Cancelar esta acción">✕</button></div>
      <div class="row">
        <textarea id="inp" rows="1" placeholder="Escribe qué quieres hacer…" autofocus></textarea>
        <button class="send" id="send">Enviar</button>
      </div>
      <div class="hint">Enter envía · Shift+Enter nueva línea · Ctrl+K busca una acción · /ayuda para ver los comandos</div>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';
  var token = new URLSearchParams(location.search).get('t') || '';
  var $ = function (id) { return document.getElementById(id); };
  var chat = $('chat'), inp = $('inp');
  var S = null, MENU = [], busy = false, ended = false;
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } }
  };
  var openSet = LS.get('cr-open', null); // null = por defecto: solo el primer grupo
  var showTools = LS.get('cr-tools', false);
  var hist = [], hi = 0;

  function post(path, body) {
    return fetch('/api/' + path, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-token': token },
      body: JSON.stringify(body || {})
    }).catch(function () { banner('No llego a claude-router. ¿Sigue abierto en la consola?', true); });
  }
  function kfmt(n) { return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(Math.round(n)); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // ---------- Chat ----------
  var hello = null;
  function nearBottom() { return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80; }
  function addEntry(en) {
    if (hello) { hello.remove(); hello = null; }
    var stick = nearBottom();
    var d = el('div', 'e ' + en.k);
    d.innerHTML = en.h; // el servidor escapa todo el texto y solo emite <span class="c-… b">
    chat.appendChild(d);
    while (chat.childElementCount > 2500) chat.removeChild(chat.firstChild);
    if (stick || en.k === 'user') chat.scrollTop = chat.scrollHeight;
  }
  function setTools(v) {
    showTools = v;
    $('chatwrap').classList.toggle('show-tools', v);
    $('toolsToggle').setAttribute('aria-pressed', v ? 'true' : 'false');
    LS.set('cr-tools', v);
  }

  // ---------- Menú ----------
  function isOpen(g, idx) { return openSet ? openSet.indexOf(g.name) >= 0 : idx === 0; }
  function renderMenu() {
    var q = $('q').value.trim().toLowerCase();
    var box = $('menu');
    box.innerHTML = '';
    box.classList.toggle('searching', !!q);
    if (q) {
      var n = 0;
      MENU.forEach(function (g) {
        g.items.forEach(function (it) {
          var hay = (it.label + ' ' + it.desc + ' ' + it.id + ' ' + g.title).toLowerCase();
          if (hay.indexOf(q) < 0) return;
          n++;
          box.appendChild(itemBtn(it, g.title));
        });
      });
      if (!n) box.appendChild(el('div', 'empty', 'Nada que coincida con «' + q + '».'));
      return;
    }
    MENU.forEach(function (g, idx) {
      var wrap = el('div', 'grp' + (isOpen(g, idx) ? ' open' : ''));
      var h = el('button');
      h.setAttribute('aria-expanded', isOpen(g, idx) ? 'true' : 'false');
      h.appendChild(el('span', 'car', '▸'));
      h.appendChild(document.createTextNode(g.title));
      h.addEventListener('click', function () {
        var cur = openSet || MENU.map(function (x, i) { return i === 0 ? x.name : null; }).filter(Boolean);
        var pos = cur.indexOf(g.name);
        if (pos >= 0) cur.splice(pos, 1); else cur.push(g.name);
        openSet = cur;
        LS.set('cr-open', openSet);
        renderMenu();
      });
      wrap.appendChild(h);
      var items = el('div', 'items');
      g.items.forEach(function (it) { items.appendChild(itemBtn(it)); });
      wrap.appendChild(items);
      box.appendChild(wrap);
    });
  }
  function itemBtn(it, groupTitle) {
    var b = el('button', 'item', it.label);
    if (it.desc) b.title = it.desc;
    if (groupTitle) b.title = (it.desc ? it.desc + ' · ' : '') + groupTitle;
    b.addEventListener('click', function () { press(it.id); });
    return b;
  }
  function press(id) {
    $('side').classList.remove('open');
    $('q').value = '';
    renderMenu();
    post('press', { id: id });
    inp.focus();
  }

  // ---------- Estado ----------
  function banner(text, bad, action) {
    var b = $('banner');
    b.className = 'banner' + (text ? ' show' : '') + (bad ? ' bad' : '');
    b.innerHTML = '';
    if (!text) return;
    b.appendChild(el('span', null, text));
    if (action) {
      var btn = el('button', null, action.label);
      btn.addEventListener('click', action.fn);
      b.appendChild(btn);
    }
  }

  function render() {
    if (!S) return;
    busy = S.busy;
    document.title = 'claude-router · ' + S.project;
    $('proj').textContent = S.project + (S.stack ? '  ·  ' + S.stack : '');
    $('chipProfile').textContent = 'Perfil: ' + S.profile.label;
    $('chipProfile').title = S.profile.desc + ' (clic para cambiar)';
    $('chipPerm').textContent = 'Permisos: ' + S.permission;

    var a = S.auth, ca = $('chipAuth');
    ca.innerHTML = '';
    ca.appendChild(el('span', 'dot ' + (a.loggedIn ? 'ok' : 'bad')));
    ca.appendChild(document.createTextNode(!a.installed ? 'claude no encontrado' : a.loggedIn ? 'Sesión ' + (a.method || 'activa') : 'Sin login · pulsa aquí'));

    var lv = $('live');
    lv.className = 'chip live' + (S.busy ? ' busy' : '');
    lv.innerHTML = '';
    if (S.busy) {
      var tier = S.active ? S.active.tier : null;
      lv.appendChild(el('span', 'spin'));
      lv.appendChild(el('span', tier ? 't-' + tier : '', (tier || 'pensando') + (S.active && S.active.agent ? ' · ' + S.active.agent : '')));
    } else if (S.pending && S.pending.main) {
      lv.appendChild(el('span', 't-' + S.pending.main, 'próxima: ' + S.pending.main));
    } else if (S.queueRunning) {
      lv.textContent = 'cola en marcha…';
    } else {
      lv.textContent = 'en espera';
    }

    // Aviso de versión nueva (solo si no hay otro aviso más importante)
    if (S.updating) banner('Actualizando claude-router…');
    else if (S.update) banner('Hay una versión nueva: v' + S.update + ' (tienes v' + S.version + ').', false, { label: 'Actualizar', fn: function () { post('press', { id: 'update' }); } });
    else if (!ended) banner('');

    renderStats();
    renderQuick();
    var p = $('pending');
    if (S.pending) {
      p.classList.add('show');
      $('pendingText').textContent = S.pending.queue ? 'Añadiendo a la cola: escribe la tarea y pulsa Enviar.' : (S.pending.label || 'Acción') + ': completa la frase y pulsa Enviar.';
    } else p.classList.remove('show');
    var sb = $('send');
    sb.textContent = S.busy ? 'Cancelar' : 'Enviar';
    sb.className = 'send' + (S.busy ? ' cancel' : '');
  }

  function renderStats() {
    var box = $('stats'), s = S;
    box.innerHTML = '';
    s.tiers.forEach(function (t) {
      var sp = el('span');
      var d = el('span', 'dot'); d.style.background = 'var(--' + t.tier + ')';
      sp.appendChild(d);
      sp.appendChild(document.createTextNode(' ' + t.tier + ' '));
      sp.appendChild(el('b', null, kfmt(t.out)));
      box.appendChild(sp);
    });
    var cost = el('span'); cost.appendChild(document.createTextNode('~$')); cost.appendChild(el('b', null, s.cost.toFixed(2))); box.appendChild(cost);
    var ratio = Math.min(1, s.ctx / s.compactAt);
    var cx = el('span'); cx.appendChild(document.createTextNode('contexto ')); cx.appendChild(el('b', null, kfmt(s.ctx)));
    var cb = el('span', 'ctxbar'); var ci = el('i'); ci.style.width = Math.round(ratio * 100) + '%'; ci.style.background = ratio >= 1 ? 'var(--bad)' : ratio >= 0.6 ? 'var(--warn)' : 'var(--ok)'; cb.appendChild(ci); cx.appendChild(cb);
    box.appendChild(cx);
    if (s.delegated) box.appendChild(el('span', null, 'delegado ' + Math.round(s.delegated.pct * 100) + '% (' + s.delegated.n + ')'));
    if (s.drift.total) box.appendChild(el('span', s.drift.level === 0 ? '' : 'c-yellow', s.drift.level === 0 ? '✔ te nombra' : '⚠ ' + s.drift.strikes + ' sin nombre'));
    if (s.repo) box.appendChild(el('span', null, 'git ✔ ' + s.ckptCount + ' fotos'));
    else { var g = el('button', 'warnlink', 'sin git: sin deshacer'); g.addEventListener('click', function () { post('press', { id: 'gitinit' }); }); box.appendChild(g); }
    if (s.queueLen) box.appendChild(el('span', null, 'cola ' + s.queueLen));
  }

  function renderQuick() {
    var q = $('quick');
    q.innerHTML = '';
    MENU.forEach(function (g) {
      g.items.forEach(function (it) {
        if (!it.primary) return;
        var b = el('button', null, it.label);
        b.disabled = busy;
        b.addEventListener('click', function () { press(it.id); });
        q.appendChild(b);
      });
    });
  }

  // ---------- Entrada ----------
  function autosize() { inp.style.height = 'auto'; inp.style.height = Math.min(200, inp.scrollHeight) + 'px'; }
  function submit() {
    if (busy) { post('cancel'); return; }
    var t = inp.value.trim();
    if (!t) return;
    hist.push(t); hi = hist.length;
    inp.value = ''; autosize();
    post('send', { text: t });
  }
  inp.addEventListener('input', autosize);
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); return; }
    if (e.key === 'ArrowUp' && (inp.value === '' || inp.selectionStart === 0) && hist.length) { e.preventDefault(); hi = Math.max(0, hi - 1); inp.value = hist[hi]; autosize(); }
    if (e.key === 'ArrowDown' && hi < hist.length && inp.selectionStart === inp.value.length) { e.preventDefault(); hi = Math.min(hist.length, hi + 1); inp.value = hist[hi] || ''; autosize(); }
    if (e.key === 'Escape' && S && S.pending) { post('cancel-pending'); inp.value = ''; autosize(); }
  });
  $('send').addEventListener('click', submit);
  $('pendingX').addEventListener('click', function () { post('cancel-pending'); inp.value = ''; autosize(); inp.focus(); });
  $('chipProfile').addEventListener('click', function () { post('press', { id: 'profile' }); });
  $('chipPerm').addEventListener('click', function () { post('press', { id: 'perm' }); });
  $('chipAuth').addEventListener('click', function () { post('press', { id: 'login' }); });
  $('toolsToggle').addEventListener('click', function () { setTools(!showTools); });
  $('menuBtn').addEventListener('click', function () { $('side').classList.toggle('open'); });
  $('q').addEventListener('input', renderMenu);
  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { $('q').value = ''; renderMenu(); inp.focus(); }
    if (e.key === 'Enter') { var first = $('menu').querySelector('.item'); if (first) first.click(); }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('side').classList.add('open'); $('q').focus(); $('q').select(); }
  });

  // ---------- Conexión ----------
  function connect() {
    var es = new EventSource('/events?t=' + encodeURIComponent(token));
    es.addEventListener('init', function (e) {
      var d = JSON.parse(e.data);
      S = d.s; MENU = d.menu; ended = false;
      chat.innerHTML = ''; hello = null;
      if (!d.log.length) {
        hello = el('div', 'hello', 'Pulsa una acción de la izquierda o escribe tu instrucción abajo. Dentro de cada instrucción, Sonnet coordina, Haiku hace lo mecánico y Opus solo lo difícil.');
        chat.appendChild(hello);
      }
      d.log.forEach(addEntry);
      chat.scrollTop = chat.scrollHeight;
      banner('');
      renderMenu(); render();
    });
    es.addEventListener('log', function (e) { addEntry(JSON.parse(e.data)); });
    es.addEventListener('state', function (e) {
      var d = JSON.parse(e.data);
      var changed = JSON.stringify(d.menu) !== JSON.stringify(MENU);
      S = d.s; MENU = d.menu;
      if (changed && !$('q').value) renderMenu();
      render();
    });
    es.addEventListener('input', function (e) {
      var d = JSON.parse(e.data);
      inp.value = d.text || ''; autosize(); inp.focus();
      var l = inp.value.length; inp.setSelectionRange(l, l);
    });
    es.onerror = function () {
      if (es.readyState === EventSource.CLOSED) { ended = true; banner('claude-router se ha cerrado. Vuelve a escribir  cla  en la consola.', true); }
      else banner('Reconectando con claude-router…', true);
    };
  }

  setTools(showTools);
  autosize();
  connect();
})();
</script>
</body>
</html>
