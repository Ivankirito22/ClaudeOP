<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-router</title>
<style>
:root {
  color-scheme: dark;
  --bg: #1b1a19; --panel: #232220; --panel2: #2d2b28; --panel3: #373430; --line: #3a3835;
  --text: #f4f1ea; --dim: #b4b0a5; --faint: #7f7b72;
  --accent: #d97757; --accent2: #e8906d; --accent-bg: rgba(217, 119, 87, .14); --accent-line: rgba(217, 119, 87, .55);
  --ok: #92c383; --warn: #e6b866; --bad: #ee7b6f;
  --haiku: #92c383; --sonnet: #7fb4e8; --opus: #c493ea;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent-line); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--panel3); border-radius: 8px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #4a4742; }

.app { height: 100%; display: grid; grid-template-columns: 276px minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); grid-template-areas: "top top" "banner banner" "side main"; }
.top { grid-area: top; } .banner { grid-area: banner; } .side { grid-area: side; } .main { grid-area: main; }

/* Barra superior */
.top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); min-height: 54px; }
.logo { color: var(--accent); font-size: 22px; line-height: 1; }
.brand { font: 600 18px var(--serif); letter-spacing: .1px; }
.proj { color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; font-size: 12.5px; color: var(--dim); white-space: nowrap; }
button.chip { transition: border-color .12s, color .12s; }
button.chip:hover { border-color: var(--accent-line); color: var(--text); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
.live { min-width: 118px; justify-content: center; }
.live.busy { border-color: var(--accent-line); background: var(--accent-bg); color: var(--text); }
.spin { width: 12px; height: 12px; border: 2px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.t-haiku { color: var(--haiku); } .t-sonnet { color: var(--sonnet); } .t-opus { color: var(--opus); }
#menuBtn { display: none; }

.banner { display: none; align-items: center; gap: 12px; padding: 8px 16px; background: var(--accent-bg); border-bottom: 1px solid var(--accent-line); font-size: 13px; }
.banner.show { display: flex; }
.banner.bad { background: rgba(238, 123, 111, .12); border-bottom-color: rgba(238, 123, 111, .5); }
.banner button { border: 1px solid var(--accent); background: var(--accent); color: #1b1a19; font-weight: 600; border-radius: 8px; padding: 3px 12px; }

/* Menú */
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.search { padding: 12px 12px 8px; }
.search input { width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; color: var(--text); font: inherit; }
.search input::placeholder { color: var(--faint); }
.search input:focus { border-color: var(--accent-line); outline: none; }
.menu { overflow: auto; padding: 0 8px 14px; flex: 1; }
.grp { margin-top: 4px; }
.grp > button { width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; color: var(--faint); font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .9px; display: flex; gap: 8px; border-radius: 8px; }
.grp > button:hover { color: var(--text); }
.grp > button .car { width: 10px; transition: transform .12s; display: inline-block; color: var(--accent); }
.grp.open > button .car { transform: rotate(90deg); }
.grp .items { display: none; }
.grp.open .items { display: block; }
.item { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; background: none; border: 1px solid transparent; padding: 7px 10px 7px 14px; border-radius: 9px; color: var(--text); }
.item:hover { background: var(--panel2); }
.item .mk { color: var(--faint); font-size: 15px; line-height: 1; opacity: 0; transition: opacity .1s; flex: none; }
.item:hover .mk { opacity: 1; }
.item.on { background: var(--accent-bg); border-color: var(--accent-line); }
.item.on .mk { opacity: 1; color: var(--accent2); font-weight: 700; }
.searching .item { padding-left: 12px; }
.empty { color: var(--faint); padding: 12px; font-size: 13px; }

/* Zona principal */
.main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
.stats { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 8px 20px; font-size: 12px; color: var(--faint); }
.stats b { color: var(--dim); font-weight: 600; }
.stats .warnlink { color: var(--warn); background: none; border: 0; padding: 0; text-decoration: underline dotted; }
.ctxbar { display: inline-block; width: 52px; height: 4px; background: var(--panel3); border-radius: 3px; vertical-align: middle; margin-left: 6px; overflow: hidden; }
.ctxbar i { display: block; height: 100%; background: var(--ok); }
.chatwrap { position: relative; min-height: 0; display: flex; }
.chat { flex: 1; overflow: auto; padding: 10px 24px 28px; font: 13px/1.55 var(--mono); }
.col { max-width: 920px; margin: 0 auto; }
.tools-toggle { position: absolute; right: 18px; top: 4px; z-index: 2; font: 12px var(--sans); border: 1px solid var(--line); background: var(--panel); color: var(--faint); border-radius: 999px; padding: 3px 11px; }
.tools-toggle:hover { color: var(--text); }
.tools-toggle[aria-pressed="true"] { color: var(--accent2); border-color: var(--accent-line); }
.e { white-space: pre-wrap; word-break: break-word; margin-top: 0; margin-bottom: 0; }
.e.user { margin-top: 18px; margin-bottom: 8px; padding: 10px 16px; width: fit-content; max-width: 88%; margin-left: auto; background: var(--panel2); border: 1px solid var(--line); border-radius: 16px 16px 4px 16px; font: 14px/1.5 var(--sans);}
.e.head { margin-top: 12px; font: 600 12px var(--sans); letter-spacing: .3px; color: var(--dim); }
.e.tool { display: none; color: var(--faint); font-size: 12px; padding-left: 8px; }
.show-tools .e.tool { display: block; }
.e.sep { color: var(--faint); font-size: 11.5px; margin-top: 10px; margin-bottom: 4px; border-top: 1px solid var(--line); padding-top: 8px; font-family: var(--sans); }
.e.deleg { padding-left: 10px; font-size: 12.5px; }
.e.text { padding-left: 10px; }
.c-green { color: var(--haiku); } .c-cyan { color: var(--sonnet); } .c-magenta { color: var(--opus); }
.c-yellow { color: var(--warn); } .c-red { color: var(--bad); } .c-gray { color: var(--dim); } .c-white { color: var(--text); }
.b { font-weight: 650; }
.hello { text-align: center; margin: 4vh auto 28px; max-width: 560px; font-family: var(--sans); }
.hello .big { color: var(--accent); font-size: 40px; line-height: 1; }
.hello h1 { font: 500 30px/1.2 var(--serif); margin: 14px 0 10px; }
.hello p { color: var(--dim); margin: 0 0 6px; }
.hello .steps { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
.hello .steps span { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 8px 14px; color: var(--dim); font-size: 13px; }
.hello .steps b { color: var(--accent2); }

/* Caja de escribir */
.composer { padding: 6px 20px 16px; }
.card { max-width: 920px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px 10px; transition: border-color .12s, box-shadow .12s; }
.card:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px rgba(217, 119, 87, .10); }
.tray { display: none; flex-wrap: wrap; align-items: center; gap: 6px; padding: 2px 2px 8px; }
.tray.show { display: flex; }
.tray .lbl { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .8px; margin-right: 2px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 11px; border-radius: 999px; background: var(--accent-bg); border: 1px solid var(--accent-line); font-size: 13px; }
.tag button { background: none; border: 0; color: var(--dim); padding: 0 4px; font-size: 14px; line-height: 1; border-radius: 50%; }
.tag button:hover { color: var(--text); }
.tray .clear { background: none; border: 0; color: var(--faint); font-size: 12px; text-decoration: underline dotted; }
.pending { display: none; align-items: center; gap: 8px; padding: 2px 2px 8px; font-size: 13px; color: var(--dim); }
.pending.show { display: flex; }
.pending button { margin-left: auto; background: none; border: 0; color: var(--faint); font-size: 16px; line-height: 1; }
textarea { display: block; width: 100%; resize: none; max-height: 220px; min-height: 44px; padding: 6px 6px; border: 0; background: transparent; color: var(--text); font: 15px/1.5 var(--sans); }
textarea::placeholder { color: var(--faint); }
textarea:focus-visible { outline: none; }
.bar { display: flex; align-items: center; gap: 8px; padding-top: 6px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
.quick button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 11px; font-size: 12.5px; color: var(--dim); transition: all .1s; }
.quick button:hover:not(:disabled) { border-color: var(--accent-line); color: var(--text); }
.quick button.on { background: var(--accent-bg); border-color: var(--accent-line); color: var(--text); }
.quick button:disabled { opacity: .4; cursor: default; }
.send { flex: none; border: 0; border-radius: 12px; padding: 0 18px; height: 38px; background: var(--accent); color: #1b1a19; font-weight: 650; transition: background .1s; }
.send:hover { background: var(--accent2); }
.send.cancel { background: var(--panel3); color: var(--text); }
.hint { max-width: 920px; margin: 8px auto 0; color: var(--faint); font-size: 12px; text-align: center; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "banner" "main"; }
  .side { position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; width: 84%; max-width: 330px; transform: translateX(-102%); transition: transform .18s; box-shadow: 6px 0 30px rgba(0,0,0,.55); }
  .side.open { transform: none; }
  #menuBtn { display: inline-flex; }
  .proj { display: none; }
  .top { flex-wrap: wrap; gap: 6px; padding: 8px 10px; }
  .chip { padding: 4px 9px; font-size: 12px; }
  .live { min-width: 0; }
  .hide-sm { display: none; }
  .chat { padding: 8px 12px 20px; }
  .composer { padding: 4px 10px 12px; }
  .hello { margin-top: 5vh; } .hello h1 { font-size: 24px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="chip" id="menuBtn" aria-label="Abrir el menú de acciones">☰ Acciones</button>
    <span class="logo" aria-hidden="true">✻</span>
    <span class="brand">claude-router</span>
    <span class="proj" id="proj"></span>
    <span class="spacer"></span>
    <button class="chip hide-sm" id="chipProfile" title="Cambiar perfil (Económico / Equilibrado / Calidad)"></button>
    <button class="chip hide-sm" id="chipPerm" title="Cambiar el modo de permisos"></button>
    <button class="chip" id="chipAuth" title="Login / estado de la sesión de Claude"></button>
    <span class="chip live" id="live"></span>
  </header>

  <div class="banner" id="banner"></div>

  <nav class="side" id="side" aria-label="Acciones">
    <div class="search"><input id="q" type="search" placeholder="Buscar acción…  (Ctrl+K)" autocomplete="off"></div>
    <div class="menu" id="menu"></div>
  </nav>

  <main class="main">
    <div class="stats" id="stats"></div>
    <div class="chatwrap" id="chatwrap">
      <button class="tools-toggle" id="toolsToggle" aria-pressed="false" title="Mostrar u ocultar las líneas de herramientas (⚙)">detalle</button>
      <div class="chat" id="chat" aria-live="polite"><div class="col" id="col"></div></div>
    </div>
    <div class="composer">
      <div class="card">
        <div class="tray" id="tray"></div>
        <div class="pending" id="pending"><span id="pendingText"></span><button id="pendingX" aria-label="Cancelar esta acción">✕</button></div>
        <textarea id="inp" rows="1" placeholder="Escribe qué quieres hacer…" autofocus></textarea>
        <div class="bar">
          <div class="quick" id="quick"></div>
          <button class="send" id="send">Enviar</button>
        </div>
      </div>
      <div class="hint" id="hint">Pulsa uno o varios botones y/o escribe con tus palabras · Enter envía todo junto · Shift+Enter nueva línea · Ctrl+K busca</div>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';
  var token = new URLSearchParams(location.search).get('t') || '';
  var $ = function (id) { return document.getElementById(id); };
  var chat = $('chat'), col = $('col'), inp = $('inp');
  var S = null, MENU = [], busy = false, ended = false;
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } }
  };
  var openSet = LS.get('cr-open', null); // null = por defecto: solo el primer grupo
  var showTools = LS.get('cr-tools', false);
  var hist = [], hi = 0;

  function post(path, body) {
    return fetch('/api/' + path, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-token': token },
      body: JSON.stringify(body || {})
    }).catch(function () { banner('No llego a claude-router. ¿Sigue abierto en la consola?', true); });
  }
  function kfmt(n) { return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(Math.round(n)); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // ---------- Chat ----------
  var hello = null;
  function nearBottom() { return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80; }
  function addEntry(en) {
    if (hello && en.k === 'user') { hello.remove(); hello = null; }
    var stick = nearBottom();
    var d = el('div', 'e ' + en.k);
    d.innerHTML = en.h; // el servidor escapa todo el texto y solo emite <span class="c-… b">
    col.appendChild(d);
    while (col.childElementCount > 2500) col.removeChild(col.firstChild);
    if (stick || en.k === 'user') chat.scrollTop = chat.scrollHeight;
  }
  function makeHello() {
    var h = el('div', 'hello');
    h.appendChild(el('div', 'big', '✻'));
    h.appendChild(el('h1', null, '¿Qué hacemos hoy' + (S && S.userName ? ', ' + S.userName : '') + '?'));
    h.appendChild(el('p', null, 'Sonnet coordina, Haiku hace lo mecánico y Opus solo lo difícil, todo dentro de cada instrucción.'));
    var st = el('div', 'steps');
    [['1', 'Pulsa uno o varios botones'], ['2', 'Añade lo que quieras con tus palabras'], ['3', 'Enter: se hace todo junto']].forEach(function (x) {
      var s = el('span'); s.appendChild(el('b', null, x[0] + '  ')); s.appendChild(document.createTextNode(x[1])); st.appendChild(s);
    });
    h.appendChild(st);
    return h;
  }
  function setTools(v) {
    showTools = v;
    $('chatwrap').classList.toggle('show-tools', v);
    $('toolsToggle').setAttribute('aria-pressed', v ? 'true' : 'false');
    LS.set('cr-tools', v);
  }

  // ---------- Menú ----------
  function isOpen(g, idx) { return openSet ? openSet.indexOf(g.name) >= 0 : idx === 0; }
  function renderMenu() {
    var q = $('q').value.trim().toLowerCase();
    var box = $('menu');
    box.innerHTML = '';
    box.classList.toggle('searching', !!q);
    if (q) {
      var n = 0;
      MENU.forEach(function (g) {
        g.items.forEach(function (it) {
          var hay = (it.label + ' ' + it.desc + ' ' + it.id + ' ' + g.title).toLowerCase();
          if (hay.indexOf(q) < 0) return;
          n++;
          box.appendChild(itemBtn(it, g.title));
        });
      });
      if (!n) box.appendChild(el('div', 'empty', 'Nada que coincida con «' + q + '».'));
      return;
    }
    MENU.forEach(function (g, idx) {
      var wrap = el('div', 'grp' + (isOpen(g, idx) ? ' open' : ''));
      var h = el('button');
      h.setAttribute('aria-expanded', isOpen(g, idx) ? 'true' : 'false');
      h.appendChild(el('span', 'car', '▸'));
      h.appendChild(document.createTextNode(g.title));
      h.addEventListener('click', function () {
        var cur = openSet || MENU.map(function (x, i) { return i === 0 ? x.name : null; }).filter(Boolean);
        var pos = cur.indexOf(g.name);
        if (pos >= 0) cur.splice(pos, 1); else cur.push(g.name);
        openSet = cur;
        LS.set('cr-open', openSet);
        renderMenu();
      });
      wrap.appendChild(h);
      var items = el('div', 'items');
      g.items.forEach(function (it) { items.appendChild(itemBtn(it)); });
      wrap.appendChild(items);
      box.appendChild(wrap);
    });
  }
  function itemBtn(it, groupTitle) {
    var b = el('button', 'item' + (it.inTray ? ' on' : ''));
    b.appendChild(el('span', null, it.label));
    if (it.stack) b.appendChild(el('span', 'mk', it.inTray ? '✓' : '＋'));
    var tip = it.desc || '';
    if (it.stack) tip = (tip ? tip + ' · ' : '') + (it.inTray ? 'Clic para quitarlo de la bandeja' : 'Clic para añadirlo a la bandeja');
    if (groupTitle) tip = (tip ? tip + ' · ' : '') + groupTitle;
    if (tip) b.title = tip;
    b.addEventListener('click', function () { press(it.id, it.stack); });
    return b;
  }
  function press(id, stack) {
    $('side').classList.remove('open');
    if (!stack) { $('q').value = ''; renderMenu(); }
    post('press', { id: id });
    inp.focus();
  }

  // ---------- Estado ----------
  function banner(text, bad, action) {
    var b = $('banner');
    b.className = 'banner' + (text ? ' show' : '') + (bad ? ' bad' : '');
    b.innerHTML = '';
    if (!text) return;
    b.appendChild(el('span', null, text));
    if (action) {
      var btn = el('button', null, action.label);
      btn.addEventListener('click', action.fn);
      b.appendChild(btn);
    }
  }

  function render() {
    if (!S) return;
    busy = S.busy;
    document.title = 'claude-router · ' + S.project;
    $('proj').textContent = S.project + (S.stack ? '  ·  ' + S.stack : '');
    $('chipProfile').textContent = 'Perfil: ' + S.profile.label;
    $('chipProfile').title = S.profile.desc + ' (clic para cambiar)';
    $('chipPerm').textContent = 'Permisos: ' + S.permission;

    var a = S.auth, ca = $('chipAuth');
    ca.innerHTML = '';
    ca.appendChild(el('span', 'dot ' + (a.loggedIn ? 'ok' : 'bad')));
    ca.appendChild(document.createTextNode(!a.installed ? 'claude no encontrado' : a.loggedIn ? 'Sesión ' + (a.method || 'activa') : 'Sin login · pulsa aquí'));

    var lv = $('live');
    lv.className = 'chip live' + (S.busy ? ' busy' : '');
    lv.innerHTML = '';
    if (S.busy) {
      var tier = S.active ? S.active.tier : null;
      lv.appendChild(el('span', 'spin'));
      lv.appendChild(el('span', tier ? 't-' + tier : '', (tier || 'pensando') + (S.active && S.active.agent ? ' · ' + S.active.agent : '')));
    } else if (S.pending && S.pending.main) {
      lv.appendChild(el('span', 't-' + S.pending.main, 'próxima: ' + S.pending.main));
    } else if (S.queueRunning) {
      lv.textContent = 'cola en marcha…';
    } else {
      lv.textContent = 'en espera';
    }

    if (S.updating) banner('Actualizando claude-router…');
    else if (S.update) banner('Hay una versión nueva: v' + S.update + ' (tienes v' + S.version + ').', false, { label: 'Actualizar', fn: function () { post('press', { id: 'update' }); } });
    else if (!ended) banner('');

    renderStats();
    renderQuick();
    renderTray();
    var p = $('pending');
    if (S.pending) {
      p.classList.add('show');
      $('pendingText').textContent = S.pending.queue ? 'Añadiendo a la cola: escribe la tarea y pulsa Enviar.' : (S.pending.label || 'Acción') + ': completa la frase y pulsa Enviar.';
    } else p.classList.remove('show');
    var n = S.tray.length, sb = $('send');
    sb.textContent = S.busy ? 'Cancelar' : (n ? 'Enviar (' + n + ')' : 'Enviar');
    sb.className = 'send' + (S.busy ? ' cancel' : '');
    var need = S.tray.filter(function (t) { return t.needsText; })[0];
    inp.placeholder = need ? '«' + need.label + '»: cuéntame qué quieres…'
      : n ? 'Añade detalles si quieres (opcional) y pulsa Enviar…'
      : 'Escribe qué quieres hacer… (si encaja con un flujo, lo uso solo)';
  }

  function renderTray() {
    var t = $('tray');
    t.innerHTML = '';
    if (!S.tray.length) { t.classList.remove('show'); return; }
    t.classList.add('show');
    t.appendChild(el('span', 'lbl', 'Bandeja'));
    S.tray.forEach(function (it) {
      var tag = el('span', 'tag');
      tag.appendChild(document.createTextNode(it.label));
      var x = el('button', null, '✕');
      x.setAttribute('aria-label', 'Quitar ' + it.label);
      x.addEventListener('click', function () { post('tray-remove', { id: it.id }); inp.focus(); });
      tag.appendChild(x);
      t.appendChild(tag);
    });
    if (S.tray.length > 1) {
      var c = el('button', 'clear', 'vaciar');
      c.addEventListener('click', function () { post('tray-clear'); inp.focus(); });
      t.appendChild(c);
    }
  }

  function renderStats() {
    var box = $('stats'), s = S;
    box.innerHTML = '';
    s.tiers.forEach(function (t) {
      var sp = el('span');
      var d = el('span', 'dot'); d.style.background = 'var(--' + t.tier + ')';
      sp.appendChild(d);
      sp.appendChild(document.createTextNode(' ' + t.tier + ' '));
      sp.appendChild(el('b', null, kfmt(t.out)));
      box.appendChild(sp);
    });
    var cost = el('span'); cost.appendChild(document.createTextNode('~$')); cost.appendChild(el('b', null, s.cost.toFixed(2))); box.appendChild(cost);
    var ratio = Math.min(1, s.ctx / s.compactAt);
    var cx = el('span'); cx.appendChild(document.createTextNode('contexto ')); cx.appendChild(el('b', null, kfmt(s.ctx)));
    var cb = el('span', 'ctxbar'); var ci = el('i'); ci.style.width = Math.round(ratio * 100) + '%'; ci.style.background = ratio >= 1 ? 'var(--bad)' : ratio >= 0.6 ? 'var(--warn)' : 'var(--ok)'; cb.appendChild(ci); cx.appendChild(cb);
    box.appendChild(cx);
    if (s.delegated) box.appendChild(el('span', null, 'delegado ' + Math.round(s.delegated.pct * 100) + '% (' + s.delegated.n + ')'));
    if (s.drift.total) box.appendChild(el('span', s.drift.level === 0 ? '' : 'c-yellow', s.drift.level === 0 ? '✔ te nombra' : '⚠ ' + s.drift.strikes + ' sin nombre'));
    if (s.repo) box.appendChild(el('span', null, 'git ✔ ' + s.ckptCount + ' fotos'));
    else { var g = el('button', 'warnlink', 'sin git: sin deshacer'); g.addEventListener('click', function () { post('press', { id: 'gitinit' }); }); box.appendChild(g); }
    if (s.queueLen) box.appendChild(el('span', null, 'cola ' + s.queueLen));
  }

  function renderQuick() {
    var q = $('quick');
    q.innerHTML = '';
    MENU.forEach(function (g) {
      g.items.forEach(function (it) {
        if (!it.primary) return;
        var b = el('button', it.inTray ? 'on' : '', it.label);
        b.disabled = busy;
        b.addEventListener('click', function () { press(it.id, it.stack); });
        q.appendChild(b);
      });
    });
  }

  // ---------- Entrada ----------
  function autosize() { inp.style.height = 'auto'; inp.style.height = Math.min(220, inp.scrollHeight) + 'px'; }
  function submit() {
    if (busy) { post('cancel'); return; }
    var t = inp.value.trim();
    if (!t && !(S && S.tray.length)) return;
    if (t) { hist.push(t); hi = hist.length; }
    inp.value = ''; autosize();
    post('send', { text: t });
  }
  inp.addEventListener('input', autosize);
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); return; }
    if (e.key === 'ArrowUp' && (inp.value === '' || inp.selectionStart === 0) && hist.length) { e.preventDefault(); hi = Math.max(0, hi - 1); inp.value = hist[hi]; autosize(); }
    if (e.key === 'ArrowDown' && hi < hist.length && inp.selectionStart === inp.value.length) { e.preventDefault(); hi = Math.min(hist.length, hi + 1); inp.value = hist[hi] || ''; autosize(); }
    if (e.key === 'Escape' && S) {
      if (S.tray.length) post('tray-clear');
      else if (S.pending) { post('cancel-pending'); inp.value = ''; autosize(); }
    }
  });
  $('send').addEventListener('click', submit);
  $('pendingX').addEventListener('click', function () { post('cancel-pending'); inp.value = ''; autosize(); inp.focus(); });
  $('chipProfile').addEventListener('click', function () { post('press', { id: 'profile' }); });
  $('chipPerm').addEventListener('click', function () { post('press', { id: 'perm' }); });
  $('chipAuth').addEventListener('click', function () { post('press', { id: 'login' }); });
  $('toolsToggle').addEventListener('click', function () { setTools(!showTools); });
  $('menuBtn').addEventListener('click', function () { $('side').classList.toggle('open'); });
  $('q').addEventListener('input', renderMenu);
  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { $('q').value = ''; renderMenu(); inp.focus(); }
    if (e.key === 'Enter') { var first = $('menu').querySelector('.item'); if (first) first.click(); }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('side').classList.add('open'); $('q').focus(); $('q').select(); }
  });

  // ---------- Conexión ----------
  function connect() {
    var es = new EventSource('/events?t=' + encodeURIComponent(token));
    es.addEventListener('init', function (e) {
      var d = JSON.parse(e.data);
      S = d.s; MENU = d.menu; ended = false;
      col.innerHTML = ''; hello = null;
      hello = makeHello(); col.appendChild(hello);
      d.log.forEach(addEntry);
      chat.scrollTop = chat.scrollHeight;
      banner('');
      renderMenu(); render();
    });
    es.addEventListener('log', function (e) { addEntry(JSON.parse(e.data)); });
    es.addEventListener('state', function (e) {
      var d = JSON.parse(e.data);
      var changed = JSON.stringify(d.menu) !== JSON.stringify(MENU);
      S = d.s; MENU = d.menu;
      if (changed && !$('q').value) renderMenu();
      render();
    });
    es.addEventListener('input', function (e) {
      var d = JSON.parse(e.data);
      inp.value = d.text || ''; autosize(); inp.focus();
      var l = inp.value.length; inp.setSelectionRange(l, l);
    });
    es.onerror = function () {
      if (es.readyState === EventSource.CLOSED) { ended = true; banner('claude-router se ha cerrado. Vuelve a escribir  cla  en la consola.', true); }
      else banner('Reconectando con claude-router…', true);
    };
  }

  setTools(showTools);
  autosize();
  connect();
})();
</script>
</body>
</html>
