<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-router</title>
<style>
:root {
  color-scheme: dark;
  --bg: #1b1a19; --panel: #232220; --panel2: #2d2b28; --panel3: #373430; --line: #3a3835;
  --text: #f4f1ea; --dim: #b4b0a5; --faint: #7f7b72;
  --accent: #d97757; --accent2: #e8906d; --accent-bg: rgba(217, 119, 87, .14); --accent-line: rgba(217, 119, 87, .55);
  --ok: #92c383; --warn: #e6b866; --bad: #ee7b6f;
  --haiku: #92c383; --sonnet: #7fb4e8; --opus: #c493ea;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent-line); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--panel3); border-radius: 8px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #4a4742; }

.app { height: 100%; display: grid; grid-template-columns: 276px minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); grid-template-areas: "top top" "banner banner" "side main"; }
.top { grid-area: top; } .banner { grid-area: banner; } .side { grid-area: side; } .main { grid-area: main; }

/* Barra superior */
.top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); min-height: 54px; }
.logo { color: var(--accent); font-size: 22px; line-height: 1; }
.brand { font: 600 18px var(--serif); letter-spacing: .1px; }
.proj { color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; font-size: 12.5px; color: var(--dim); white-space: nowrap; }
button.chip { transition: border-color .12s, color .12s; }
button.chip:hover { border-color: var(--accent-line); color: var(--text); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
.live { min-width: 118px; justify-content: center; }
.live.busy { border-color: var(--accent-line); background: var(--accent-bg); color: var(--text); }
.spin { width: 12px; height: 12px; border: 2px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.t-haiku { color: var(--haiku); } .t-sonnet { color: var(--sonnet); } .t-opus { color: var(--opus); }
#menuBtn { display: none; }

.banner { display: none; align-items: center; gap: 12px; padding: 8px 16px; background: var(--accent-bg); border-bottom: 1px solid var(--accent-line); font-size: 13px; }
.banner.show { display: flex; }
.banner.bad { background: rgba(238, 123, 111, .12); border-bottom-color: rgba(238, 123, 111, .5); }
.banner button { border: 1px solid var(--accent); background: var(--accent); color: #1b1a19; font-weight: 600; border-radius: 8px; padding: 3px 12px; }

/* Menú */
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.search { padding: 12px 12px 8px; }
.search input { width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; color: var(--text); font: inherit; }
.search input::placeholder { color: var(--faint); }
.search input:focus { border-color: var(--accent-line); outline: none; }
.menu { overflow: auto; padding: 0 8px 14px; flex: 1; }
.grp { margin-top: 6px; padding-top: 4px; border-top: 1px solid var(--line); }
.grp:first-child { border-top: 0; margin-top: 0; }
.grp .items { padding: 2px 2px 4px; }
.grp > button { width: 100%; text-align: left; background: none; border: 0; padding: 9px 10px 8px; color: var(--faint); font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .9px; display: flex; gap: 8px; border-radius: 8px; }
.grp > button:hover { color: var(--text); }
.grp > button .car { width: 10px; transition: transform .12s; display: inline-block; color: var(--accent); }
.grp.open > button .car { transform: rotate(90deg); }
.grp .items { display: none; }
.grp.open .items { display: block; }
.irow { position: relative; margin: 0 0 6px; }
.irow .item { margin: 0; padding-right: 40px; }
.ib { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--dim); font: italic 700 13px Georgia, serif; line-height: 1; display: grid; place-content: center; padding: 0; }
.ib:hover, .ib.act { color: var(--accent2); border-color: var(--accent); background: var(--accent-bg); }
.item { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; background: var(--panel2); border: 1px solid var(--line); padding: 8px 12px; margin: 0 0 6px; border-radius: 10px; color: var(--text); transition: border-color .12s, background .12s, transform .08s; }
.irow .item { margin: 0; }
.item:hover { background: var(--panel3); border-color: var(--accent-line); }
.item:active { transform: scale(.985); }
.item .mk { color: var(--faint); font-size: 15px; line-height: 1; opacity: 0; transition: opacity .1s; flex: none; }
.item:hover .mk { opacity: 1; }
.item.on { background: var(--accent-bg); border-color: var(--accent); }
.item.on .mk { opacity: 1; color: var(--accent2); font-weight: 700; }
.searching .item { padding-left: 12px; }
.menu { padding: 4px 10px 14px; }
.empty { color: var(--faint); padding: 12px; font-size: 13px; }

/* Zona principal */
.main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
.stats { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 8px 20px; font-size: 12px; color: var(--faint); }
.stats b { color: var(--dim); font-weight: 600; }
.stats .warnlink { color: var(--warn); background: none; border: 0; padding: 0; text-decoration: underline dotted; }
.ctxbar { display: inline-block; width: 52px; height: 4px; background: var(--panel3); border-radius: 3px; vertical-align: middle; margin-left: 6px; overflow: hidden; }
.ctxbar i { display: block; height: 100%; background: var(--ok); }
.chatwrap { position: relative; min-height: 0; display: flex; }
.chat { flex: 1; overflow: auto; padding: 10px 24px 28px; font: 13px/1.55 var(--mono); }
.col { max-width: 920px; margin: 0 auto; }
.tools-toggle { position: absolute; right: 18px; top: 4px; z-index: 2; font: 12px var(--sans); border: 1px solid var(--line); background: var(--panel); color: var(--faint); border-radius: 999px; padding: 3px 11px; }
.tools-toggle:hover { color: var(--text); }
.tools-toggle[aria-pressed="true"] { color: var(--accent2); border-color: var(--accent-line); }
@keyframes fin { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.e, .sg { animation: fin .18s ease-out; }
.e { white-space: pre-wrap; word-break: break-word; margin-top: 0; margin-bottom: 0; }
.e.user { margin-top: 18px; margin-bottom: 8px; padding: 10px 16px; width: fit-content; max-width: 88%; margin-left: auto; background: var(--panel2); border: 1px solid var(--line); border-radius: 16px 16px 4px 16px; font: 14px/1.5 var(--sans);}
.e.head { margin-top: 12px; font: 600 12px var(--sans); letter-spacing: .3px; color: var(--dim); }
.e.tool { display: none; color: var(--faint); font-size: 12px; padding-left: 8px; }
.show-tools .e.tool { display: block; }
.e.sep { color: var(--faint); font-size: 11.5px; margin-top: 10px; margin-bottom: 4px; border-top: 1px solid var(--line); padding-top: 8px; font-family: var(--sans); }
.e.deleg { padding-left: 10px; font-size: 12.5px; }
.e.text { padding-left: 10px; }
.c-green { color: var(--haiku); } .c-cyan { color: var(--sonnet); } .c-magenta { color: var(--opus); }
.c-yellow { color: var(--warn); } .c-red { color: var(--bad); } .c-gray { color: var(--dim); } .c-white { color: var(--text); }
.b { font-weight: 650; }
.hello { text-align: center; margin: 4vh auto 28px; max-width: 560px; font-family: var(--sans); }
.hello .big { color: var(--accent); font-size: 40px; line-height: 1; }
.hello h1 { font: 500 30px/1.2 var(--serif); margin: 14px 0 10px; }
.hello p { color: var(--dim); margin: 0 0 6px; }
.hello .steps { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
.hello .steps span { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 8px 14px; color: var(--dim); font-size: 13px; }
.hello .steps b { color: var(--accent2); }


/* Pasos de la tarea: grupos desplegables como en Claude (modelo + instrucción + tiempo) */
.sg { margin: 6px 0 6px 10px; font-family: var(--sans); }
.sgh { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; background: none; border: 0; padding: 5px 8px; border-radius: 9px; color: var(--dim); font-size: 13px; }
.sgh:hover { background: var(--panel); color: var(--text); }
.sgh .car { width: 10px; color: var(--faint); transition: transform .12s; display: inline-block; flex: none; }
.sg.open > .sgh .car { transform: rotate(90deg); }
.sgh .sum { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sgh .tm, .st .tm { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12px; flex: none; }
.sg.run > .sgh { color: var(--text); }
.sgb { display: none; margin: 2px 0 4px 12px; padding-left: 12px; border-left: 1px solid var(--line); }
.sg.open > .sgb, .show-tools .sgb { display: block; }
.show-tools .sg > .sgh .car { transform: rotate(90deg); }
.st { }
.sth { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 4px 8px; border-radius: 8px; color: var(--dim); font-size: 12.5px; }
.sth:hover { background: var(--panel); }
.sth .ic { width: 14px; flex: none; text-align: center; font-size: 12px; }
.sth .ic.ok { color: var(--ok); } .sth .ic.bad { color: var(--bad); }
.sth .nm { font-weight: 600; color: var(--text); flex: none; }
.sth .ag { color: var(--faint); flex: none; }
.sth .dt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
.sth .md { flex: none; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); }
.sth .md.t-haiku { border-color: rgba(146,195,131,.5); } .sth .md.t-sonnet { border-color: rgba(127,180,232,.5); } .sth .md.t-opus { border-color: rgba(196,147,234,.5); }
.stb { display: none; margin: 2px 0 6px 22px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font: 12px/1.5 var(--mono); color: var(--dim); white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
.st.open > .stb { display: block; }
.spin.sm { width: 10px; height: 10px; border-width: 2px; display: inline-block; }

/* Cronómetro y tiempo aproximado de la tarea en curso */
.runbar { display: none; max-width: 920px; margin: 0 auto 8px; padding: 8px 14px; border: 1px solid var(--accent-line); background: var(--accent-bg); border-radius: 14px; font-size: 12.5px; color: var(--dim); }
.runbar.show { display: block; }
.runbar .rt { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
.runbar b { color: var(--text); font-variant-numeric: tabular-nums; }
.runbar .rl { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.runbar .pb { height: 4px; background: var(--panel3); border-radius: 3px; margin-top: 7px; overflow: hidden; }
.runbar .pb i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .9s linear; }
.runbar .pb.ind i { width: 35%; animation: ind 1.6s ease-in-out infinite; }
@keyframes ind { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }

/* Ventanita ⓘ de cada etiqueta */
#info { position: fixed; z-index: 60; width: min(380px, calc(100vw - 24px)); max-height: min(80vh, 560px); overflow: auto; background: var(--panel); border: 1px solid var(--accent-line); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.45); padding: 14px 16px 12px; display: none; animation: fin .14s ease-out; font-size: 13px; line-height: 1.5; }
#info.show { display: block; }
#info h4 { margin: 0 28px 6px 0; font-size: 15px; }
#info .x { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--dim); }
#info .x:hover { color: var(--text); }
#info p { margin: 0 0 10px; color: var(--text); }
#info .lb { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--faint); font-weight: 600; }
#info .ag { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-top: 1px solid var(--line); }
#info .ag:first-of-type { border-top: 0; }
#info .ag b { flex: none; min-width: 92px; font-weight: 600; }
#info .ag b i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
#info .ag span { color: var(--dim); font-size: 12.5px; }
#info ol { margin: 0; padding-left: 20px; color: var(--dim); font-size: 12.5px; }
#info ol li { padding: 1px 0; }
#info details { margin-top: 10px; }
#info summary { cursor: pointer; color: var(--faint); font-size: 12px; }
#info pre { white-space: pre-wrap; margin: 6px 0 0; font-size: 11.5px; color: var(--dim); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; max-height: 180px; overflow: auto; }
#info .note { margin-top: 8px; color: var(--faint); font-size: 12px; }
@media (max-width: 640px) { #info { left: 12px !important; right: 12px; top: auto !important; bottom: 12px; width: auto; } }

/* Permiso para sobrescribir */
.perm { display: none; margin: 0 0 8px; border: 1px solid var(--warn); background: var(--panel); border-radius: 12px; padding: 10px 14px; font-size: 13px; }
.perm.show { display: block; animation: fin .18s ease-out; }
.perm b { color: var(--warn); }
.perm ul { margin: 6px 0 8px; padding-left: 20px; color: var(--dim); font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
.perm .pb { display: flex; gap: 8px; }
.perm .pb button { border: 1px solid var(--line); background: transparent; border-radius: 9px; padding: 5px 14px; color: var(--text); }
.perm .pb button.ok { background: var(--accent); color: #1b1a19; border-color: var(--accent); font-weight: 650; }
.perm .pb button:hover { border-color: var(--accent); }
#bell.off { opacity: .6; }

/* Creando el plan (feedback inmediato) */
.routing { display: none; align-items: center; gap: 12px; padding: 8px 12px; margin: 0 0 8px; border: 1px solid var(--accent-line); background: var(--accent-bg); border-radius: 12px; font-size: 13px; }
.routing.show { display: flex; }
.routing .spin { flex: none; }
.routing .rtx { flex: 1; min-width: 0; color: var(--text); }
.routing .rtx small { display: block; color: var(--dim); font-size: 12px; }
.routing button { border: 1px solid var(--line); background: transparent; border-radius: 9px; padding: 4px 11px; font-size: 12px; color: var(--dim); }
.routing button:hover { color: var(--text); border-color: var(--accent-line); }

/* A continuación: cola de instrucciones */
.nextq { display: none; max-width: 920px; margin: 0 auto 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 8px 10px 6px; }
.nextq.show { display: block; }
.nextq .nh { display: flex; align-items: center; gap: 10px; padding: 0 4px 6px; font-size: 12px; color: var(--faint); text-transform: uppercase; letter-spacing: .8px; font-weight: 600; }
.nextq .nh .grow { flex: 1; }
.nextq .nh button { text-transform: none; letter-spacing: 0; font-weight: 400; background: none; border: 0; color: var(--faint); font-size: 12px; text-decoration: underline dotted; }
.nextq .nh button.resume { background: var(--accent); color: #1b1a19; border-radius: 8px; padding: 2px 10px; text-decoration: none; font-weight: 650; }
.nextq .paused { padding: 0 4px 6px; color: var(--warn); font-size: 12.5px; }
.nq { display: flex; align-items: center; gap: 10px; padding: 6px 8px; margin-bottom: 5px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; animation: fin .18s ease-out; }
.nq .n { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-bg); border: 1px solid var(--accent-line); color: var(--accent2); font-size: 12px; display: grid; place-content: center; font-weight: 650; }
.nq .nt { flex: 1; min-width: 0; }
.nq .nt b { font-weight: 600; font-size: 13px; }
.nq .nt span { display: block; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nq .nt em { font-style: normal; color: var(--faint); font-size: 11.5px; }
.nq button { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--dim); line-height: 1; }
.nq button:hover { color: var(--text); border-color: var(--accent-line); }

.runbar .rt .stop { margin-left: auto; border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 9px; padding: 3px 12px; font-size: 12px; }
.runbar .rt .stop:hover { border-color: var(--bad); color: var(--bad); }
.tgl { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 11px; font-size: 12.5px; color: var(--dim); }
.tgl i { width: 24px; height: 13px; border-radius: 999px; background: var(--panel3); position: relative; flex: none; transition: background .15s; }
.tgl i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 9px; height: 9px; border-radius: 50%; background: var(--faint); transition: transform .15s, background .15s; }
.tgl.on { color: var(--text); border-color: var(--accent-line); }
.tgl.on i { background: var(--accent-bg); }
.tgl.on i::after { transform: translateX(11px); background: var(--accent); }
.tgl:hover { border-color: var(--accent-line); }
.plan .pa .off { background: none; border: 0; color: var(--faint); font-size: 12px; text-decoration: underline dotted; padding: 4px 2px; }
.plan .pa .off:hover { color: var(--text); }

/* Caja de escribir */
.composer { padding: 6px 20px 16px; }
.card { max-width: 920px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px 10px; transition: border-color .12s, box-shadow .12s; }
.card:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px rgba(217, 119, 87, .10); }
.tray { display: none; flex-wrap: wrap; align-items: center; gap: 6px; padding: 2px 2px 8px; }
.tray.show { display: flex; }
.tray .lbl { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .8px; margin-right: 2px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 11px; border-radius: 999px; background: var(--accent-bg); border: 1px solid var(--accent-line); font-size: 13px; }
.tag button { background: none; border: 0; color: var(--dim); padding: 0 4px; font-size: 14px; line-height: 1; border-radius: 50%; }
.tag button:hover { color: var(--text); }
.tray .clear { background: none; border: 0; color: var(--faint); font-size: 12px; text-decoration: underline dotted; }

/* Plan previo con checks */
.plan { display: none; padding: 2px 2px 10px; }
.plan.show { display: block; }
.plan .ph { display: flex; align-items: baseline; gap: 10px; padding: 0 2px 6px; }
.plan .ph b { font: 600 15px var(--serif); }
.plan .ph span { color: var(--faint); font-size: 12px; }
.plan .pl { max-height: 38vh; overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 4px 6px; }
.plan .gh { font: 600 10.5px var(--sans); text-transform: uppercase; letter-spacing: .9px; color: var(--faint); padding: 8px 8px 2px; }
.plan label.row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.plan label.row:hover { background: var(--panel2); }
.plan input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; flex: none; border: 1.5px solid var(--faint); border-radius: 5px; background: transparent; display: grid; place-content: center; cursor: pointer; margin: 0; }
.plan input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
.plan input[type=checkbox]:checked::after { content: ""; width: 9px; height: 5px; border-left: 2px solid #1b1a19; border-bottom: 2px solid #1b1a19; transform: rotate(-45deg) translate(1px, -1px); }
.plan label.row .tx { flex: 1; min-width: 0; }
.plan label.row.off .tx { color: var(--faint); text-decoration: line-through; }
.plan label.row .sub { color: var(--faint); font-size: 12px; white-space: nowrap; }
.plan label.row .sub.t-haiku, .plan label.row .sub.t-sonnet, .plan label.row .sub.t-opus { opacity: .9; }
.plan .pa { display: flex; align-items: center; gap: 8px; padding: 10px 2px 0; }
.plan .pa .hintp { color: var(--faint); font-size: 12px; flex: 1; }
.plan .pa button { border-radius: 10px; padding: 7px 16px; border: 1px solid var(--line); background: transparent; }
.plan .pa button.go { background: var(--accent); border-color: var(--accent); color: #1b1a19; font-weight: 650; }
.plan .pa button.go:hover { background: var(--accent2); }
.plan .pa button:disabled { opacity: .45; cursor: default; }
.pending { display: none; align-items: center; gap: 8px; padding: 2px 2px 8px; font-size: 13px; color: var(--dim); }
.pending.show { display: flex; }
.pending button { margin-left: auto; background: none; border: 0; color: var(--faint); font-size: 16px; line-height: 1; }
textarea { display: block; width: 100%; resize: none; max-height: 220px; min-height: 44px; padding: 6px 6px; border: 0; background: transparent; color: var(--text); font: 15px/1.5 var(--sans); }
textarea::placeholder { color: var(--faint); }
textarea:focus-visible { outline: none; }
.bar { display: flex; align-items: center; gap: 8px; padding-top: 6px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
.quick button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 11px; font-size: 12.5px; color: var(--dim); transition: all .1s; }
.quick button:hover:not(:disabled) { border-color: var(--accent-line); color: var(--text); }
.quick button.on { background: var(--accent-bg); border-color: var(--accent-line); color: var(--text); }
.quick button:disabled { opacity: .4; cursor: default; }
.send { flex: none; border: 0; border-radius: 12px; padding: 0 18px; height: 38px; background: var(--accent); color: #1b1a19; font-weight: 650; transition: background .1s; }
.send:hover { background: var(--accent2); }
.send.cancel { background: var(--panel3); color: var(--text); }
.hint { max-width: 920px; margin: 8px auto 0; color: var(--faint); font-size: 12px; text-align: center; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "banner" "main"; }
  .side { position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; width: 84%; max-width: 330px; transform: translateX(-102%); transition: transform .18s; box-shadow: 6px 0 30px rgba(0,0,0,.55); }
  .side.open { transform: none; }
  #menuBtn { display: inline-flex; }
  .proj { display: none; }
  .top { flex-wrap: wrap; gap: 6px; padding: 8px 10px; }
  .chip { padding: 4px 9px; font-size: 12px; }
  .live { min-width: 0; }
  .hide-sm { display: none; }
  .chat { padding: 8px 12px 20px; }
  .composer { padding: 4px 10px 12px; }
  .hello { margin-top: 5vh; } .hello h1 { font-size: 24px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="chip" id="menuBtn" aria-label="Abrir el menú de acciones">☰ Acciones</button>
    <span class="logo" aria-hidden="true">✻</span>
    <span class="brand">claude-router</span>
    <span class="proj" id="proj"></span>
    <span class="spacer"></span>
    <button class="chip hide-sm" id="chipProfile" title="Cambiar perfil (Económico / Equilibrado / Calidad)"></button>
    <button class="chip hide-sm" id="chipPerm" title="Cambiar el modo de permisos"></button>
    <button class="chip" id="chipAuth" title="Login / estado de la sesión de Claude"></button>
    <button class="chip" id="bell" title="Avisos del sistema"></button>
    <span class="chip live" id="live"></span>
  </header>

  <div class="banner" id="banner"></div>

  <nav class="side" id="side" aria-label="Acciones">
    <div class="search"><input id="q" type="search" placeholder="Buscar acción…  (Ctrl+K)" autocomplete="off"></div>
    <div class="menu" id="menu"></div>
  </nav>

  <main class="main">
    <div class="stats" id="stats"></div>
    <div class="chatwrap" id="chatwrap">
      <button class="tools-toggle" id="toolsToggle" aria-pressed="false" title="Mostrar u ocultar las líneas de herramientas (⚙)">detalle</button>
      <div class="chat" id="chat" aria-live="polite"><div class="col" id="col"></div></div>
    </div>
    <div class="composer">
      <div class="runbar" id="runbar"></div>
      <div class="nextq" id="nextq"></div>
      <div class="card">
        <div class="perm" id="perm"></div>
        <div class="routing" id="routing"></div>
        <div class="plan" id="plan"></div>
        <div class="tray" id="tray"></div>
        <div class="pending" id="pending"><span id="pendingText"></span><button id="pendingX" aria-label="Cancelar esta acción">✕</button></div>
        <textarea id="inp" rows="1" placeholder="Escribe qué quieres hacer…" autofocus></textarea>
        <div class="bar">
          <div class="quick" id="quick"></div>
          <button class="tgl" id="planTgl" title="Plan previo: te enseña la lista de pasos con checks antes de ejecutar"><i></i><span>Plan</span></button>
          <button class="send" id="send">Enviar</button>
        </div>
      </div>
      <div class="hint" id="hint">Pulsa uno o varios botones y/o escribe con tus palabras · Enter envía todo junto (si está trabajando, se pone a continuación) · Shift+Enter nueva línea · Ctrl+K busca</div>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';
  var token = new URLSearchParams(location.search).get('t') || '';
  var $ = function (id) { return document.getElementById(id); };
  var chat = $('chat'), col = $('col'), inp = $('inp');
  var S = null, MENU = [], busy = false, ended = false;
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } }
  };
  var openSet = LS.get('cr-open', null); // null = por defecto: solo el primer grupo
  var showTools = LS.get('cr-tools', false);
  var hist = [], hi = 0;

  function post(path, body) {
    return fetch('/api/' + path, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-token': token },
      body: JSON.stringify(body || {})
    }).catch(function () { banner('No llego a claude-router. ¿Sigue abierto en la consola?', true); });
  }
  function kfmt(n) { return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(Math.round(n)); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // ---------- Chat ----------
  var hello = null;
  function nearBottom() { return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80; }
  function addEntry(en) {
    if (en.k === 'step') return addStep(en);
    curGroup = null;
    if (hello && en.k === 'user') { hello.remove(); hello = null; }
    var stick = nearBottom();
    var d = el('div', 'e ' + en.k);
    d.innerHTML = en.h; // el servidor escapa todo el texto y solo emite <span class="c-… b">
    col.appendChild(d);
    while (col.childElementCount > 2500) col.removeChild(col.firstChild);
    if (stick || en.k === 'user') chat.scrollTop = chat.scrollHeight;
  }

  // ---------- Pasos de la tarea (desplegables) ----------
  var steps = {};      // id -> { d, row, ic, tm, group }
  var curGroup = null; // grupo de pasos consecutivos que se está rellenando
  var skew = 0;        // reloj del servidor - reloj del navegador
  var nowMs = function () { return Date.now() + skew; };
  function clock(ms) { var t = Math.max(0, Math.round(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60; return (h ? h + ':' + (m < 10 ? '0' : '') + m : m) + ':' + (s < 10 ? '0' : '') + s; }
  function dur(ms) { if (ms < 1000) return '<1 s'; var s = Math.round(ms / 1000); if (s < 60) return s + ' s'; var m = Math.floor(s / 60); return m + ' min ' + (s % 60) + ' s'; }

  function stepTitle(d) { return (d.kind === 'agent' ? '↳ ' : '') + d.name + (d.detail ? ' · ' + d.detail : ''); }
  function addStep(d) {
    if (hello) { hello.remove(); hello = null; }
    var stick = nearBottom();
    if (!curGroup) {
      var g = { ids: [], el: el('div', 'sg'), head: el('button', 'sgh'), body: el('div', 'sgb') };
      g.head.appendChild(el('span', 'car', '▸'));
      g.ic = el('span', 'ic'); g.head.appendChild(g.ic);
      g.sum = el('span', 'sum'); g.head.appendChild(g.sum);
      g.tm = el('span', 'tm'); g.head.appendChild(g.tm);
      g.head.addEventListener('click', function () { g.el.classList.toggle('open'); });
      g.el.appendChild(g.head); g.el.appendChild(g.body);
      col.appendChild(g.el);
      curGroup = g;
    }
    var g2 = curGroup;
    var row = el('div', 'st');
    var hd = el('button', 'sth');
    var ic = el('span', 'ic'); hd.appendChild(ic);
    hd.appendChild(el('span', 'nm', d.kind === 'agent' ? '↳ ' + d.name : d.name));
    if (d.kind !== 'agent' && d.agent) hd.appendChild(el('span', 'ag', 'en ' + d.agent));
    hd.appendChild(el('span', 'dt', d.detail || ''));
    hd.appendChild(el('span', 'md t-' + d.tier, d.tier));
    var tm = el('span', 'tm'); hd.appendChild(tm);
    row.appendChild(hd);
    var full = (d.full && d.full !== d.detail) ? d.full : (d.detail || d.name);
    var pre = el('div', 'stb'); pre.textContent = full; row.appendChild(pre);
    hd.addEventListener('click', function () { row.classList.toggle('open'); });
    g2.body.appendChild(row);
    steps[d.id] = { d: d, ic: ic, tm: tm, g: g2 };
    g2.ids.push(d.id);
    paintStep(steps[d.id]);
    paintGroup(g2);
    if (stick) chat.scrollTop = chat.scrollHeight;
  }
  function paintStep(s) {
    var d = s.d, run = !d.end;
    s.ic.className = 'ic' + (run ? '' : d.error ? ' bad' : ' ok');
    if (run) { if (!s.ic.firstChild || !s.ic.firstChild.className) { s.ic.textContent = ''; s.ic.appendChild(el('span', 'spin sm')); } }
    else s.ic.textContent = d.error ? '✗' : '✓';
    s.tm.textContent = dur((d.end || nowMs()) - d.start);
  }
  function paintGroup(g) {
    var run = null, first = Infinity, last = 0, n = g.ids.length, ag = 0, running = 0;
    g.ids.forEach(function (id) {
      var d = steps[id].d;
      if (d.start < first) first = d.start;
      if (d.kind === 'agent') ag++;
      if (!d.end) { run = d; running++; last = Math.max(last, nowMs()); } else last = Math.max(last, d.end);
    });
    g.el.classList.toggle('run', !!run);
    if (run) { if (!g.ic.firstChild || !g.ic.firstChild.className) { g.ic.textContent = ''; g.ic.appendChild(el('span', 'spin sm')); } }
    else { g.ic.textContent = '✓'; g.ic.style.color = 'var(--ok)'; }
    g.sum.textContent = run ? (run.kind === 'agent' ? 'Delegando · ' : 'Ejecutando · ') + stepTitle(run) + (running > 1 ? '  (+' + (running - 1) + ' a la vez)' : '')
      : n + (n === 1 ? ' acción' : ' acciones') + (ag ? ' · ' + ag + (ag === 1 ? ' subagente' : ' subagentes') : '');
    g.tm.textContent = clock(last - first);
  }
  function endStep(id, end, error) {
    var s = steps[id];
    if (!s || s.d.end) return;
    s.d.end = end; s.d.error = !!error;
    paintStep(s); paintGroup(s.g);
  }
  function tick() {
    var any = false;
    Object.keys(steps).forEach(function (id) { var s = steps[id]; if (!s.d.end) { any = true; paintStep(s); } });
    if (any) { var seen = []; Object.keys(steps).forEach(function (id) { var s = steps[id]; if (!s.d.end && seen.indexOf(s.g) < 0) { seen.push(s.g); paintGroup(s.g); } }); }
    renderRun(true);
    tickRouting();
  }
  setInterval(tick, 1000);


  // ---------- Permiso para sobrescribir ----------
  var permSig = '';
  function renderPerm() {
    var box = $('perm'), p = S.perm;
    if (!p) { box.classList.remove('show'); box.innerHTML = ''; permSig = ''; return; }
    var sig = JSON.stringify(p);
    box.classList.add('show');
    if (sig === permSig) return;
    permSig = sig;
    box.innerHTML = '';
    var t = el('div'); t.appendChild(el('b', null, '🛡 Claude necesita tu permiso. ')); t.appendChild(document.createTextNode('Quiere reescribir entero ' + (p.files.length > 1 ? 'estos archivos, que ya existían:' : 'un archivo que ya existía:')));
    box.appendChild(t);
    var ul = el('ul'); p.files.forEach(function (f) { ul.appendChild(el('li', null, f.rel)); }); box.appendChild(ul);
    var pb = el('div', 'pb');
    var ok = el('button', 'ok', 'Permitir (solo la próxima tarea)'); ok.addEventListener('click', function () { post('perm-allow'); });
    var no = el('button', null, 'Denegar'); no.addEventListener('click', function () { post('perm-deny'); });
    pb.appendChild(ok); pb.appendChild(no); box.appendChild(pb);
  }

  // ---------- Avisos del sistema (notificaciones del navegador / Windows) ----------
  function notifPerm() { try { return window.Notification ? Notification.permission : 'unsupported'; } catch (e) { return 'unsupported'; } }
  function renderBell() {
    var b = $('bell'), p = notifPerm(), on = S.notify && p === 'granted';
    b.textContent = on ? '🔔 Avisos' : '🔕 Avisos';
    b.className = 'chip' + (on ? '' : ' off');
    b.title = p === 'unsupported' ? 'Este navegador no admite notificaciones' : p === 'denied' ? 'Las notificaciones están bloqueadas en el navegador (candado de la barra de direcciones)' : on ? 'Te aviso cuando necesite algo de ti o termine, aunque estés en otra ventana. Clic para desactivar.' : 'Clic para activar los avisos de Windows';
  }
  $('bell').addEventListener('click', function () {
    var p = notifPerm();
    if (p === 'unsupported' || p === 'denied') return;
    if (p === 'default') {
      Notification.requestPermission().then(function () { if (!S.notify) post('press', { id: 'notify' }); renderBell(); });
      return;
    }
    post('press', { id: 'notify' });
  });
  function onNotify(n) {
    if (notifPerm() !== 'granted') return;
    if (n.kind === 'done' && n.ms < 8000) return;
    if (!document.hidden && document.hasFocus()) return;
    try {
      var nt = new Notification(n.title, { body: n.body, tag: 'cr-' + n.kind, requireInteraction: n.kind === 'ask' || n.kind === 'plan' });
      nt.onclick = function () { window.focus(); nt.close(); };
    } catch (e) { /* sin notificaciones */ }
  }

  // ---------- Creando el plan (feedback inmediato) ----------
  var routeTm = null;
  function renderRouting() {
    var box = $('routing');
    if (!S.routing) { box.classList.remove('show'); box.innerHTML = ''; routeTm = null; return; }
    if (S.routing && S.routing.now) skew = S.routing.now - Date.now();
    box.classList.add('show');
    if (!routeTm) {
      box.innerHTML = '';
      box.appendChild(el('span', 'spin'));
      var tx = el('div', 'rtx');
      tx.appendChild(document.createTextNode('Creando el plan…'));
      routeTm = el('small', null, '');
      tx.appendChild(routeTm);
      box.appendChild(tx);
      var sk = el('button', null, 'Saltar');
      sk.title = 'No esperar a Haiku: reconoce tu frase con palabras clave y sigue';
      sk.addEventListener('click', function () { post('skip-routing'); });
      box.appendChild(sk);
    }
    tickRouting();
  }
  function tickRouting() {
    if (!routeTm || !S || !S.routing) return;
    routeTm.textContent = 'Haiku está leyendo tu frase para elegir flujos y especialistas · ' + Math.max(0, Math.round((nowMs() - S.routing.start) / 1000)) + ' s';
  }

  // ---------- A continuación (cola de instrucciones) ----------
  var nextSig = '';
  function renderNext() {
    var box = $('nextq'), list = S.next || [];
    if (!list.length) { box.classList.remove('show'); box.innerHTML = ''; nextSig = ''; return; }
    var sig = JSON.stringify([list, S.nextPaused]);
    box.classList.add('show');
    if (sig === nextSig) return;
    nextSig = sig;
    box.innerHTML = '';
    var hd = el('div', 'nh');
    hd.appendChild(el('span', null, 'A continuación · ' + list.length));
    hd.appendChild(el('span', 'grow'));
    if (S.nextPaused) { var rs = el('button', 'resume', '▶ Seguir'); rs.addEventListener('click', function () { post('next-resume'); }); hd.appendChild(rs); }
    var cl = el('button', null, 'vaciar'); cl.addEventListener('click', function () { post('next-clear'); }); hd.appendChild(cl);
    box.appendChild(hd);
    if (S.nextPaused) box.appendChild(el('div', 'paused', '⏸ En pausa porque la tarea anterior se canceló o falló. Pulsa «Seguir» para continuar.'));
    list.forEach(function (q, i) {
      var row = el('div', 'nq');
      row.appendChild(el('span', 'n', String(i + 1)));
      var tx = el('div', 'nt');
      tx.appendChild(el('b', null, q.label));
      if (q.text && q.text !== q.label) tx.appendChild(el('span', null, q.text));
      if (q.specs && q.specs.length) tx.appendChild(el('em', null, '🧩 ' + q.specs.join(', ')));
      row.appendChild(tx);
      if (i > 0) { var up = el('button', null, '↑'); up.title = 'Subir'; up.setAttribute('aria-label', 'Subir ' + q.label); up.addEventListener('click', function () { post('next-up', { id: q.id }); }); row.appendChild(up); }
      var rm = el('button', null, '✕'); rm.title = 'Quitar de la cola'; rm.setAttribute('aria-label', 'Quitar ' + q.label); rm.addEventListener('click', function () { post('next-remove', { id: q.id }); });
      row.appendChild(rm);
      box.appendChild(row);
    });
  }

  // ---------- Cronómetro de la tarea y tiempo aproximado ----------
  var runSig = '', runRefs = null;
  function renderRun(onlyTime) {
    var box = $('runbar'), r = S && S.run;
    if (!r) { box.classList.remove('show'); runSig = ''; runRefs = null; document.title = 'claude-router · ' + (S ? S.project : ''); var lt0 = $('liveT'); if (lt0) lt0.textContent = ''; return; }
    var el_ms = nowMs() - r.start;
    var sig = [r.label, r.expectedMs, r.basis, r.basisN].join('|');
    if (!runRefs || sig !== runSig) {
      runSig = sig;
      box.innerHTML = '';
      var rt = el('div', 'rt');
      var l1 = el('span', 'rl'); rt.appendChild(l1);
      var l2 = el('span'); rt.appendChild(l2);
      var l3 = el('span'); rt.appendChild(l3);
      var stop = el('button', 'stop', '■ Parar'); stop.title = 'Cancela la tarea en curso'; stop.addEventListener('click', function () { post('cancel'); });
      rt.appendChild(stop);
      box.appendChild(rt);
      var pb = el('div', 'pb'); var bi = el('i'); pb.appendChild(bi); box.appendChild(pb);
      runRefs = { l1: l1, l2: l2, l3: l3, pb: pb, bi: bi };
    }
    var f = runRefs, eta;
    f.l1.textContent = '⏱ ' + clock(el_ms);
    if (r.expectedMs) {
      var rem = r.expectedMs - el_ms;
      var why = r.basis === 'similares' ? 'según ' + r.basisN + (r.basisN === 1 ? ' vez parecida' : ' veces parecidas') : 'según tus últimas tareas largas';
      if (rem > 4000) eta = '≈ ' + clock(rem) + ' restantes';
      else if (el_ms < r.expectedMs * 1.3) eta = 'terminando…';
      else eta = 'tarda más de lo habitual (suele ~' + clock(r.expectedMs) + ')';
      f.l2.textContent = eta; f.l2.title = 'Estimación ' + why + ' (suele tardar ' + clock(r.expectedMs) + ')';
      f.pb.classList.remove('ind');
      f.bi.style.width = Math.round(Math.min(0.97, el_ms / r.expectedMs) * 100) + '%';
    } else {
      f.l2.textContent = 'sin datos para estimar (aprendo con cada tarea)'; f.l2.title = 'Tras unas cuantas tareas calculo cuánto suele tardar cada cosa';
      f.pb.classList.add('ind');
    }
    var run = Math.max(0, r.steps - r.done);
    f.l3.textContent = r.steps ? r.done + ' de ' + r.steps + ' acciones hechas' + (run ? ' · ' + run + ' en curso' : '') + (r.delegations ? ' · ' + r.delegations + ' subagentes' : '') : 'arrancando…';
    box.classList.add('show');
    var lt = $('liveT'); if (lt) lt.textContent = ' ' + clock(el_ms);
    document.title = '⏱ ' + clock(el_ms) + ' · claude-router';
  }

  function makeHello() {
    var h = el('div', 'hello');
    h.appendChild(el('div', 'big', '✻'));
    h.appendChild(el('h1', null, '¿Qué hacemos hoy' + (S && S.userName ? ', ' + S.userName : '') + '?'));
    h.appendChild(el('p', null, 'Sonnet coordina, Haiku hace lo mecánico y Opus solo lo difícil, todo dentro de cada instrucción.'));
    var st = el('div', 'steps');
    [['1', 'Pulsa uno o varios botones'], ['2', 'Añade lo que quieras con tus palabras'], ['3', 'Enter: se hace todo junto']].forEach(function (x) {
      var s = el('span'); s.appendChild(el('b', null, x[0] + '  ')); s.appendChild(document.createTextNode(x[1])); st.appendChild(s);
    });
    h.appendChild(st);
    return h;
  }
  function setTools(v) {
    showTools = v;
    $('chatwrap').classList.toggle('show-tools', v);
    $('toolsToggle').setAttribute('aria-pressed', v ? 'true' : 'false');
    LS.set('cr-tools', v);
  }

  // ---------- Menú ----------
  function isOpen(g, idx) { return openSet ? openSet.indexOf(g.name) >= 0 : idx === 0; }
  function renderMenu() {
    var q = $('q').value.trim().toLowerCase();
    var box = $('menu');
    box.innerHTML = '';
    box.classList.toggle('searching', !!q);
    if (q) {
      var n = 0;
      MENU.forEach(function (g) {
        g.items.forEach(function (it) {
          var hay = (it.label + ' ' + it.desc + ' ' + it.id + ' ' + g.title).toLowerCase();
          if (hay.indexOf(q) < 0) return;
          n++;
          box.appendChild(itemBtn(it, g.title));
        });
      });
      if (!n) box.appendChild(el('div', 'empty', 'Nada que coincida con «' + q + '».'));
      return;
    }
    MENU.forEach(function (g, idx) {
      var wrap = el('div', 'grp' + (isOpen(g, idx) ? ' open' : ''));
      var h = el('button');
      h.setAttribute('aria-expanded', isOpen(g, idx) ? 'true' : 'false');
      h.appendChild(el('span', 'car', '▸'));
      h.appendChild(document.createTextNode(g.title));
      h.addEventListener('click', function () {
        var cur = openSet || MENU.map(function (x, i) { return i === 0 ? x.name : null; }).filter(Boolean);
        var pos = cur.indexOf(g.name);
        if (pos >= 0) cur.splice(pos, 1); else cur.push(g.name);
        openSet = cur;
        LS.set('cr-open', openSet);
        renderMenu();
      });
      wrap.appendChild(h);
      var items = el('div', 'items');
      g.items.forEach(function (it) { items.appendChild(itemBtn(it)); });
      wrap.appendChild(items);
      box.appendChild(wrap);
    });
  }
  function itemBtn(it, groupTitle) {
    var row = el('div', 'irow');
    var b = el('button', 'item' + (it.inTray ? ' on' : ''));
    b.appendChild(el('span', null, it.label));
    if (it.stack) b.appendChild(el('span', 'mk', it.inTray ? '✓' : '＋'));
    var tip = '';
    if (it.stack) tip = it.inTray ? 'Clic para quitarlo de la bandeja' : 'Clic para añadirlo a la bandeja';
    if (groupTitle) tip = (tip ? tip + ' · ' : '') + groupTitle;
    if (tip) b.title = tip;
    b.addEventListener('click', function () { press(it.id, it.stack); });
    row.appendChild(b);
    if (it.info) {
      var ib = el('button', 'ib', 'i');
      ib.title = 'Qué hace esta etiqueta';
      ib.setAttribute('aria-label', 'Información: ' + it.label);
      ib.addEventListener('click', function (e) { e.stopPropagation(); showInfo(it, ib); });
      row.appendChild(ib);
    }
    return row;
  }

  // ---------- Ventanita ⓘ ----------
  var infoBtn = null;
  var TIERN = { haiku: 'Haiku', sonnet: 'Sonnet', opus: 'Opus' };
  function hideInfo() {
    var d = $('info');
    d.classList.remove('show'); d.innerHTML = '';
    if (infoBtn) infoBtn.classList.remove('act');
    infoBtn = null;
  }
  function showInfo(it, btn) {
    if (infoBtn === btn) return hideInfo();
    hideInfo();
    var d = $('info'), f = it.info;
    infoBtn = btn; btn.classList.add('act');
    var x = el('button', 'x', '✕'); x.setAttribute('aria-label', 'Cerrar'); x.addEventListener('click', hideInfo);
    d.appendChild(x);
    d.appendChild(el('h4', null, it.label));
    d.appendChild(el('p', null, f.what));
    if (f.main) {
      d.appendChild(el('div', 'lb', 'Modelo'));
      d.appendChild(el('p', null, f.main));
    }
    if (f.agents && f.agents.length) {
      d.appendChild(el('div', 'lb', 'Usa ' + f.agents.length + (f.agents.length === 1 ? ' agente' : ' agentes')));
      f.agents.forEach(function (a) {
        var r = el('div', 'ag');
        var nm = el('b'); var dot = el('i'); dot.style.background = 'var(--' + a.tier + ')'; nm.appendChild(dot);
        nm.appendChild(document.createTextNode(a.who + ' · ' + (TIERN[a.tier] || a.tier)));
        r.appendChild(nm);
        r.appendChild(el('span', null, a.does.join(' · ')));
        d.appendChild(r);
      });
    } else if (f.agents) {
      d.appendChild(el('div', 'note', 'No llama a subagentes: lo hace directamente el modelo principal.'));
    }
    if (f.flow && f.steps && f.steps.length > 1) {
      d.appendChild(el('div', 'lb', 'Pasos, en orden'));
      var ol = el('ol');
      f.steps.forEach(function (st) { ol.appendChild(el('li', null, st.label + (st.who === 'principal' ? ' (Sonnet)' : ' — ' + st.who))); });
      d.appendChild(ol);
    }
    if (f.needsText) d.appendChild(el('div', 'note', 'Esta etiqueta necesita que cuentes los detalles en la caja de texto.'));
    if (it.stack) d.appendChild(el('div', 'note', 'Puedes combinarla con otras etiquetas: se ejecutan en una sola instrucción. Antes verás el plan con checks para quitar lo que no quieras.'));
    if (f.prompt && f.prompt.length > 40) {
      var dt = el('details'); dt.appendChild(el('summary', null, 'Instrucción exacta que se envía'));
      dt.appendChild(el('pre', null, f.prompt)); d.appendChild(dt);
    }
    d.classList.add('show');
    var r = btn.getBoundingClientRect(), w = d.offsetWidth, hh = d.offsetHeight;
    var left = Math.min(Math.max(8, r.right + 10), window.innerWidth - w - 8);
    if (r.right + 10 + w > window.innerWidth - 8) left = Math.max(8, r.left - w - 10);
    var top = Math.min(Math.max(8, r.top - 12), window.innerHeight - hh - 8);
    d.style.left = left + 'px'; d.style.top = Math.max(8, top) + 'px';
    d.style.right = '';
  }
  document.addEventListener('mousedown', function (e) {
    if (infoBtn && !$('info').contains(e.target) && e.target !== infoBtn) hideInfo();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && infoBtn) { hideInfo(); e.stopPropagation(); } }, true);

  function press(id, stack) {
    $('side').classList.remove('open');
    if (!stack) { $('q').value = ''; renderMenu(); }
    post('press', { id: id });
    inp.focus();
  }

  // ---------- Estado ----------
  function banner(text, bad, action) {
    var b = $('banner');
    b.className = 'banner' + (text ? ' show' : '') + (bad ? ' bad' : '');
    b.innerHTML = '';
    if (!text) return;
    b.appendChild(el('span', null, text));
    if (action) {
      var btn = el('button', null, action.label);
      btn.addEventListener('click', action.fn);
      b.appendChild(btn);
    }
  }

  function render() {
    if (!S) return;
    busy = S.busy;
    document.title = 'claude-router · ' + S.project;
    $('proj').textContent = S.project + (S.stack ? '  ·  ' + S.stack : '');
    $('chipProfile').textContent = 'Perfil: ' + S.profile.label;
    $('chipProfile').title = S.profile.desc + ' (clic para cambiar)';
    $('chipPerm').textContent = 'Permisos: ' + S.permission;

    var a = S.auth, ca = $('chipAuth');
    ca.innerHTML = '';
    ca.appendChild(el('span', 'dot ' + (a.loggedIn ? 'ok' : 'bad')));
    ca.appendChild(document.createTextNode(!a.installed ? 'claude no encontrado' : a.loggedIn ? 'Sesión ' + (a.method || 'activa') : 'Sin login · pulsa aquí'));

    var lv = $('live');
    lv.className = 'chip live' + (S.busy || S.routing ? ' busy' : '');
    lv.innerHTML = '';
    if (S.busy) {
      var tier = S.active ? S.active.tier : null;
      lv.appendChild(el('span', 'spin'));
      lv.appendChild(el('span', tier ? 't-' + tier : '', (tier || 'pensando') + (S.active && S.active.agent ? ' · ' + S.active.agent : '')));
      var lt = el('span', null, ''); lt.id = 'liveT'; lt.style.fontVariantNumeric = 'tabular-nums'; lv.appendChild(lt);
    } else if (S.routing) {
      lv.appendChild(el('span', 'spin'));
      lv.appendChild(el('span', 't-haiku', 'leyendo tu frase…'));
    } else if (S.pending && S.pending.main) {
      lv.appendChild(el('span', 't-' + S.pending.main, 'próxima: ' + S.pending.main));
    } else if (S.queueRunning) {
      lv.textContent = 'cola en marcha…';
    } else {
      lv.textContent = 'en espera';
    }

    if (S.updating) banner('Actualizando claude-router…');
    else if (S.update) banner('Hay una versión nueva: v' + S.update + ' (tienes v' + S.version + ').', false, { label: 'Actualizar', fn: function () { post('press', { id: 'update' }); } });
    else if (!ended) banner('');

    if (S.run) skew = S.run.now - Date.now();
    renderRun();
    renderStats();
    renderQuick();
    renderTray();
    renderPerm();
    renderBell();
    renderRouting();
    renderNext();
    renderPlan();
    var p = $('pending');
    if (S.pending) {
      p.classList.add('show');
      $('pendingText').textContent = S.pending.queue ? 'Añadiendo a la cola: escribe la tarea y pulsa Enviar.' : (S.pending.label || 'Acción') + ': completa la frase y pulsa Enviar.';
    } else p.classList.remove('show');
    var n = S.tray.length, sb = $('send');
    var qm = S.busy || (S.next && S.next.length);
    sb.textContent = (qm ? 'Enviar a la cola' : 'Enviar') + (n ? ' (' + n + ')' : '');
    sb.className = 'send';
    var pt = $('planTgl'); pt.className = 'tgl' + (S.planPreview ? ' on' : ''); pt.lastChild.textContent = 'Plan: ' + (S.planPreview ? 'sí' : 'no');
    pt.setAttribute('aria-pressed', S.planPreview ? 'true' : 'false');
    var need = S.tray.filter(function (t) { return t.needsText; })[0];
    inp.placeholder = S.plan ? (S.plan.queued ? 'Plan listo: Enter lo añade a la cola · Esc lo cancela' : 'Plan listo: Enter lo ejecuta · Esc lo cancela') : S.busy ? 'Escribe otra instrucción: se pone a continuación en la cola…' : need ? '«' + need.label + '»: cuéntame qué quieres…'
      : n ? 'Añade detalles si quieres (opcional) y pulsa Enviar…'
      : 'Escribe qué quieres hacer… (si encaja con un flujo, lo uso solo)';
  }


  var planSig = '';
  function renderPlan() {
    var box = $('plan');
    var pl = S.plan;
    if (!pl) { box.classList.remove('show'); box.innerHTML = ''; planSig = ''; return; }
    var sig = JSON.stringify([pl.queued, pl.items.map(function (i) { return [i.id, i.on]; })]);
    box.classList.add('show');
    if (sig === planSig && box.firstChild) return;
    planSig = sig;
    box.innerHTML = '';
    var hd = el('div', 'ph');
    hd.appendChild(el('b', null, 'Plan'));
    hd.appendChild(el('span', null, 'Todo marcado: desmarca lo que no quieras' + (pl.note ? ' · ' + pl.note : '')));
    box.appendChild(hd);
    var list = el('div', 'pl');
    var heads = { flow: 'Flujos', step: 'Pasos', spec: 'Especialistas (solo para esta tarea)' }, last = '';
    var on = 0;
    pl.items.forEach(function (it) {
      if (it.kind !== last) { last = it.kind; list.appendChild(el('div', 'gh', heads[it.kind])); }
      if (it.on) on++;
      var row = el('label', 'row' + (it.on ? '' : ' off'));
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = it.on;
      cb.addEventListener('change', function () { post('plan-toggle', { id: it.id }); });
      row.appendChild(cb);
      row.appendChild(el('span', 'tx', it.label));
      row.appendChild(el('span', 'sub' + (it.tier ? ' t-' + it.tier : ''), it.sub));
      list.appendChild(row);
    });
    box.appendChild(list);
    var act = el('div', 'pa');
    var offb = el('button', 'off', 'Desactivar el plan previo');
    offb.title = 'Se ejecutará directamente lo que pidas (puedes volver a activarlo con el interruptor «Plan»)';
    offb.addEventListener('click', function () { post('press', { id: 'planprev' }); post('plan-run'); });
    act.appendChild(offb);
    act.appendChild(el('span', 'hintp', pl.queued ? 'Enter lo añade a la cola · Esc cancela' : 'Enter ejecuta · Esc cancela'));
    var no = el('button', null, 'Cancelar');
    no.addEventListener('click', function () { post('plan-cancel'); inp.focus(); });
    var go = el('button', 'go', pl.queued ? 'Añadir a la cola' : 'Ejecutar plan');
    go.disabled = !on && !pl.text;
    go.addEventListener('click', function () { post('plan-run'); });
    act.appendChild(no); act.appendChild(go);
    box.appendChild(act);
  }

  function renderTray() {
    var t = $('tray');
    t.innerHTML = '';
    if (!S.tray.length) { t.classList.remove('show'); return; }
    t.classList.add('show');
    t.appendChild(el('span', 'lbl', 'Bandeja'));
    S.tray.forEach(function (it) {
      var tag = el('span', 'tag');
      tag.appendChild(document.createTextNode(it.label));
      var x = el('button', null, '✕');
      x.setAttribute('aria-label', 'Quitar ' + it.label);
      x.addEventListener('click', function () { post('tray-remove', { id: it.id }); inp.focus(); });
      tag.appendChild(x);
      t.appendChild(tag);
    });
    if (S.tray.length > 1) {
      var c = el('button', 'clear', 'vaciar');
      c.addEventListener('click', function () { post('tray-clear'); inp.focus(); });
      t.appendChild(c);
    }
  }

  function renderStats() {
    var box = $('stats'), s = S;
    box.innerHTML = '';
    s.tiers.forEach(function (t) {
      var sp = el('span');
      var d = el('span', 'dot'); d.style.background = 'var(--' + t.tier + ')';
      sp.appendChild(d);
      sp.appendChild(document.createTextNode(' ' + t.tier + ' '));
      sp.appendChild(el('b', null, kfmt(t.out)));
      box.appendChild(sp);
    });
    var cost = el('span'); cost.appendChild(document.createTextNode('~$')); cost.appendChild(el('b', null, s.cost.toFixed(2))); box.appendChild(cost);
    var ratio = Math.min(1, s.ctx / s.compactAt);
    var cx = el('span'); cx.appendChild(document.createTextNode('contexto ')); cx.appendChild(el('b', null, Math.round(ratio * 100) + '% · ' + kfmt(s.ctx))); cx.title = 'Contexto de la sesión: compacto solo al llegar a ' + kfmt(s.compactAt) + ' tokens' + (s.autoCompact ? '' : ' (auto-compactar está apagado)');
    var cb = el('span', 'ctxbar'); var ci = el('i'); ci.style.width = Math.round(ratio * 100) + '%'; ci.style.background = ratio >= 1 ? 'var(--bad)' : ratio >= 0.6 ? 'var(--warn)' : 'var(--ok)'; cb.appendChild(ci); cx.appendChild(cb);
    box.appendChild(cx);
    if (s.delegated) box.appendChild(el('span', null, 'delegado ' + Math.round(s.delegated.pct * 100) + '% (' + s.delegated.n + ')'));
    if (s.drift.total) box.appendChild(el('span', s.drift.level === 0 ? '' : 'c-yellow', s.drift.level === 0 ? '✔ te nombra' : '⚠ ' + s.drift.strikes + ' sin nombre'));
    if (s.repo) box.appendChild(el('span', null, 'git ✔ ' + s.ckptCount + ' fotos'));
    else { var g = el('button', 'warnlink', 'sin git: sin deshacer'); g.addEventListener('click', function () { post('press', { id: 'gitinit' }); }); box.appendChild(g); }
    if (s.queueLen) box.appendChild(el('span', null, 'cola ' + s.queueLen));
  }

  function renderQuick() {
    var q = $('quick');
    q.innerHTML = '';
    MENU.forEach(function (g) {
      g.items.forEach(function (it) {
        if (!it.primary) return;
        var b = el('button', it.inTray ? 'on' : '', it.label);
        b.addEventListener('click', function () { press(it.id, it.stack); });
        q.appendChild(b);
      });
    });
  }

  // ---------- Entrada ----------
  function autosize() { inp.style.height = 'auto'; inp.style.height = Math.min(220, inp.scrollHeight) + 'px'; }
  function submit(fromButton) {
    var t = inp.value.trim();
    if (S && S.plan && !t) { post('plan-run'); return; }
    if (!t && !(S && S.tray.length)) return;
    if (t) { hist.push(t); hi = hist.length; }
    inp.value = ''; autosize();
    post('send', { text: t });
  }
  inp.addEventListener('input', autosize);
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); return; }
    if (e.key === 'ArrowUp' && (inp.value === '' || inp.selectionStart === 0) && hist.length) { e.preventDefault(); hi = Math.max(0, hi - 1); inp.value = hist[hi]; autosize(); }
    if (e.key === 'ArrowDown' && hi < hist.length && inp.selectionStart === inp.value.length) { e.preventDefault(); hi = Math.min(hist.length, hi + 1); inp.value = hist[hi] || ''; autosize(); }
    if (e.key === 'Escape' && S) {
      if (S.plan) post('plan-cancel');
      else if (S.tray.length) post('tray-clear');
      else if (S.pending) { post('cancel-pending'); inp.value = ''; autosize(); }
    }
  });
  $('send').addEventListener('click', function () { submit(true); });
  $('planTgl').addEventListener('click', function () { post('press', { id: 'planprev' }); inp.focus(); });
  $('pendingX').addEventListener('click', function () { post('cancel-pending'); inp.value = ''; autosize(); inp.focus(); });
  $('chipProfile').addEventListener('click', function () { post('press', { id: 'profile' }); });
  $('chipPerm').addEventListener('click', function () { post('press', { id: 'perm' }); });
  $('chipAuth').addEventListener('click', function () { post('press', { id: 'login' }); });
  $('toolsToggle').addEventListener('click', function () { setTools(!showTools); });
  $('menuBtn').addEventListener('click', function () { $('side').classList.toggle('open'); });
  $('q').addEventListener('input', renderMenu);
  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { $('q').value = ''; renderMenu(); inp.focus(); }
    if (e.key === 'Enter') { var first = $('menu').querySelector('.item'); if (first) first.click(); }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('side').classList.add('open'); $('q').focus(); $('q').select(); }
  });

  // ---------- Conexión ----------
  function connect() {
    var es = new EventSource('/events?t=' + encodeURIComponent(token));
    es.addEventListener('init', function (e) {
      var d = JSON.parse(e.data);
      S = d.s; MENU = d.menu; ended = false;
      col.innerHTML = ''; hello = null; steps = {}; curGroup = null;
      hello = makeHello(); col.appendChild(hello);
      d.log.forEach(addEntry);
      chat.scrollTop = chat.scrollHeight;
      banner('');
      renderMenu(); render();
    });
    es.addEventListener('log', function (e) { addEntry(JSON.parse(e.data)); });
    es.addEventListener('notify', function (e) { onNotify(JSON.parse(e.data)); });
    es.addEventListener('stepend', function (e) { var d = JSON.parse(e.data); endStep(d.id, d.end, d.error); });
    es.addEventListener('state', function (e) {
      var d = JSON.parse(e.data);
      var changed = JSON.stringify(d.menu) !== JSON.stringify(MENU);
      S = d.s; MENU = d.menu;
      if (changed && !$('q').value) renderMenu();
      render();
    });
    es.addEventListener('input', function (e) {
      var d = JSON.parse(e.data);
      inp.value = d.text || ''; autosize(); inp.focus();
      var l = inp.value.length; inp.setSelectionRange(l, l);
    });
    es.onerror = function () {
      if (es.readyState === EventSource.CLOSED) { ended = true; banner('claude-router se ha cerrado. Vuelve a escribir  cla  en la consola.', true); }
      else banner('Reconectando con claude-router…', true);
    };
  }

  setTools(showTools);
  autosize();
  connect();
})();
</script>
<div id="info" role="dialog" aria-label="Información de la etiqueta"></div>
</body>
</html>
