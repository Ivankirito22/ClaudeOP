<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="claudeop: Claude Code más rápido, más barato y sin tocar nada. Reparte el trabajo entre Haiku, Sonnet y Opus, vigila el contexto y mide el ahorro.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f19"/><stop offset="1" stop-color="#171132"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="0.5" stop-color="#fbbf24"/><stop offset="1" stop-color="#f87171"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset="0.5" stop-color="#34d399" stop-opacity="0.09"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/></pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1200" height="380" rx="22"/></clipPath>
    <style>
      .sans { font-family: -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
      .mono { font-family: 'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .sweep { animation: sweep 6s linear infinite; }
      @keyframes sweep { from { transform: translateY(-140px); } to { transform: translateY(400px); } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.6s; }
    </style>
  </defs>

  <rect width="1200" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="22" fill="url(#grid)"/>
  <g clip-path="url(#clip)"><rect class="sweep" width="1200" height="140" fill="url(#scan)"/></g>
  <rect x="1" y="1" width="1198" height="378" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- izquierda: título y promesa -->
  <text x="60" y="140" class="sans" font-size="92" font-weight="800" fill="url(#title)" filter="url(#glow)">claudeop<tspan class="blink" fill="#34d399">▌</tspan></text>
  <text x="62" y="190" class="sans" font-size="31" font-weight="700" fill="#f4f6fb">Claude Code más rápido, más barato</text>
  <text x="62" y="228" class="sans" font-size="31" font-weight="700" fill="#f4f6fb">y sin que toques nada.</text>

  <g class="sans" font-size="20" fill="#c9d0e3">
    <circle class="pulse" cx="72" cy="274" r="7" fill="#34d399"/><text x="92" y="281">Reparte el trabajo entre Haiku, Sonnet y Opus</text>
    <circle class="pulse d2" cx="72" cy="308" r="7" fill="#fbbf24"/><text x="92" y="315">Vigila el contexto y recorta los tokens</text>
    <circle class="pulse d3" cx="72" cy="342" r="7" fill="#f87171"/><text x="92" y="349">Instalas una vez y hablas como siempre</text>
  </g>

  <!-- derecha: una conversación de ejemplo -->
  <g class="mono">
    <rect x="720" y="46" width="430" height="288" rx="16" fill="#0b0f19" fill-opacity="0.82" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="746" cy="72" r="6" fill="#f87171"/><circle cx="766" cy="72" r="6" fill="#fbbf24"/><circle cx="786" cy="72" r="6" fill="#34d399"/>
    <text x="814" y="77" font-size="14" fill="#7c86a2">una petición normal</text>

    <text x="744" y="122" font-size="18" fill="#34d399">❯</text>
    <text x="768" y="122" font-size="18" fill="#f4f6fb">arregla el login y optimiza</text>
    <text x="744" y="156" font-size="16" fill="#fde68a">⏱ ~4–12 min</text>

    <text x="744" y="196" font-size="16" fill="#a7f3d0">● explorador</text><text x="1128" y="196" font-size="15" fill="#34d399" text-anchor="end">Haiku</text>
    <text x="744" y="226" font-size="16" fill="#fde68a">● especialista</text><text x="1128" y="226" font-size="15" fill="#fbbf24" text-anchor="end">Sonnet</text>
    <text x="744" y="256" font-size="16" fill="#fde68a">● revisor</text><text x="1128" y="256" font-size="15" fill="#fbbf24" text-anchor="end">Sonnet</text>

    <line x1="744" y1="276" x2="1126" y2="276" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="744" y="308" font-size="17" fill="#34d399" font-weight="700">✓ hecho</text>
    <text x="1128" y="308" font-size="14" fill="#7c86a2" text-anchor="end">ningún comando escrito</text>
  </g>
</svg>
