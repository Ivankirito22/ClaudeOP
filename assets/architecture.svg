<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-label="Arquitectura de claudeop: la petición pasa por hooks, Claude principal decide y reparte entre subagentes Haiku, Sonnet y Opus, y todo se mide para afinar la siguiente">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f19"/><stop offset="1" stop-color="#14102a"/></linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="0.45" stop-color="#fbbf24"/><stop offset="1" stop-color="#f87171"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="0.5" stop-color="#fbbf24"/><stop offset="1" stop-color="#f87171"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/></pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa4c0"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
    <style>
      .mono { font-family: 'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace; }
      .sans { font-family: -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
      .flow { stroke-dasharray: 6 7; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -26; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
      .d2 { animation-delay: .6s; } .d3 { animation-delay: 1.2s; } .d4 { animation-delay: 1.8s; }
      .lab { font-size: 12px; fill: #7c86a2; letter-spacing: 2px; }
      .h { font-size: 15px; font-weight: 700; fill: #f1f4fb; }
      .t { font-size: 12.5px; fill: #c3cade; }
      .s { font-size: 11px; fill: #7c86a2; }
    </style>
  </defs>

  <rect width="1200" height="1010" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="1010" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="1008" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- cabecera -->
  <text x="60" y="52" class="mono lab">ARQUITECTURA</text>
  <text x="60" y="92" class="sans" font-size="34" font-weight="800" fill="url(#title)">Cómo viaja una petición</text>
  <g class="mono" font-size="12">
    <circle cx="858" cy="48" r="5" fill="#34d399"/><text x="870" y="52" fill="#a7f3d0">Haiku</text>
    <circle cx="936" cy="48" r="5" fill="#fbbf24"/><text x="948" y="52" fill="#fde68a">Sonnet</text>
    <circle cx="1024" cy="48" r="5" fill="#f87171"/><text x="1036" y="52" fill="#fecaca">Opus</text>
    <rect x="858" y="68" width="14" height="10" rx="3" fill="none" stroke="#fbbf24"/><text x="880" y="77" fill="#fde68a">capa de ahorro</text>
  </g>

  <!-- 1 · ENTRADA -->
  <text x="60" y="150" class="mono lab">01 · ENTRADA</text>
  <rect x="380" y="118" width="440" height="60" rx="14" fill="#0b0f19" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="404" y="144" class="mono" font-size="13" fill="#34d399">❯</text>
  <text x="424" y="144" class="mono" font-size="14" fill="#e6e9f2">arregla el login y optimiza esto</text>
  <text x="424" y="164" class="mono s">lenguaje natural · con faltas también · sin comandos</text>
  <path d="M600 178V224" stroke="#9aa4c0" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path class="flow" d="M600 178V224" stroke="#34d399" stroke-width="2" fill="none"/>

  <!-- 2 · HOOKS -->
  <rect x="40" y="228" width="1120" height="214" rx="18" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="64" y="256" class="mono lab">02 · HOOKS</text>
  <text x="190" y="256" class="mono s">scripts Node de ~90 ms · ninguno llama a un modelo · cero dependencias</text>

  <g class="mono">
    <!-- route -->
    <rect x="62" y="272" width="204" height="152" rx="12" fill="#0b0f19" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="78" y="296" class="h">route</text><text x="258" y="296" class="s" text-anchor="end">prompt</text>
    <text x="78" y="320" class="t">reconoce el flujo</text>
    <text x="78" y="340" class="t">estima el ⏱ por tarea</text>
    <text x="78" y="360" class="t">avisa si contexto&gt;120k</text>
    <rect x="76" y="380" width="176" height="28" rx="8" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.7"/>
    <text x="164" y="398" class="s" fill="#fde68a" text-anchor="middle" style="fill:#fde68a">receta 1 vez por sesión</text>
    <!-- session-start -->
    <rect x="280" y="272" width="204" height="152" rx="12" fill="#0b0f19" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="296" y="296" class="h">session-start</text><text x="476" y="296" class="s" text-anchor="end">inicio</text>
    <text x="296" y="320" class="t">reglas de reparto</text>
    <text x="296" y="340" class="t">catálogo de 19 flujos</text>
    <text x="296" y="360" class="t">retoma estado.md</text>
    <rect x="294" y="380" width="176" height="28" rx="8" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.7"/>
    <text x="382" y="398" class="s" text-anchor="middle" style="fill:#fde68a">~1.100 tokens, una vez</text>
    <!-- guard -->
    <rect x="498" y="272" width="204" height="152" rx="12" fill="#0b0f19" stroke="#f87171" stroke-opacity="0.65"/>
    <text x="514" y="296" class="h">guard</text><text x="694" y="296" class="s" text-anchor="end">cada tool</text>
    <text x="514" y="320" class="t">confirma git push</text>
    <text x="514" y="340" class="t">tope de 6 subagentes</text>
    <text x="514" y="360" class="t">agrupa lo relacionado</text>
    <rect x="512" y="380" width="176" height="28" rx="8" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.7"/>
    <text x="600" y="398" class="s" text-anchor="middle" style="fill:#fde68a">frena Read entero +40 KB</text>
    <!-- track -->
    <rect x="716" y="272" width="204" height="152" rx="12" fill="#0b0f19" stroke="#34d399" stroke-opacity="0.55"/>
    <text x="732" y="296" class="h">track</text><text x="912" y="296" class="s" text-anchor="end">al terminar</text>
    <text x="732" y="320" class="t">tokens por modelo</text>
    <text x="732" y="340" class="t">tiempo real por tarea</text>
    <text x="732" y="360" class="t">contexto por turno</text>
    <rect x="730" y="380" width="176" height="28" rx="8" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="818" y="398" class="s" text-anchor="middle" style="fill:#a7f3d0">asíncrono · no frena</text>
    <!-- notify -->
    <rect x="934" y="272" width="204" height="152" rx="12" fill="#0b0f19" stroke="#fb923c" stroke-opacity="0.55"/>
    <text x="950" y="296" class="h">notify</text><text x="1130" y="296" class="s" text-anchor="end">avisos</text>
    <text x="950" y="320" class="t">avisa al terminar</text>
    <text x="950" y="340" class="t">pide permiso/pregunta</text>
    <text x="950" y="360" class="t">aviso del sistema</text>
    <rect x="948" y="380" width="176" height="28" rx="8" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="1036" y="398" class="s" text-anchor="middle" style="fill:#a7f3d0">nunca lleva tu texto</text>
  </g>

  <path d="M600 442V486" stroke="#9aa4c0" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path class="flow" d="M600 442V486" stroke="#34d399" stroke-width="2" fill="none"/>
  <text x="616" y="470" class="mono s">nota corta (~400 tokens, solo si hay trabajo)</text>

  <!-- 3 · CLAUDE PRINCIPAL -->
  <text x="60" y="526" class="mono lab">03 · DECIDE</text>

  <!-- estado.md -->
  <rect x="60" y="496" width="214" height="124" rx="12" fill="#0b0f19" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="76" y="522" class="mono h">estado.md</text>
  <text x="76" y="546" class="mono t">criterio de «hecho»</text>
  <text x="76" y="564" class="mono t">hecho · pendiente</text>
  <rect x="74" y="580" width="186" height="26" rx="8" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.7"/>
  <text x="167" y="597" class="mono s" text-anchor="middle" style="fill:#fde68a">sobrevive a compactar</text>
  <path d="M274 560H316" stroke="#9aa4c0" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4 4"/>

  <rect x="320" y="486" width="560" height="146" rx="16" fill="#0b0f19" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="1.5" filter="url(#glow)"/>
  <text x="344" y="516" class="sans" font-size="17" font-weight="800" fill="#f1f4fb">Claude principal</text>
  <text x="500" y="516" class="mono s">Sonnet · elige flujo y reparte</text>
  <text x="344" y="538" class="mono s">contexto que se reenvía en CADA mensaje</text>
  <!-- medidor 0-450k : x 344..856 (512px) -->
  <rect x="344" y="552" width="512" height="14" rx="7" fill="url(#meter)" fill-opacity="0.9"/>
  <rect x="344" y="552" width="512" height="14" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
  <path d="M473 546V574" stroke="#fde68a" stroke-width="2"/>
  <path d="M572 546V574" stroke="#34d399" stroke-width="2.5"/>
  <text x="467" y="590" class="mono s" text-anchor="end" style="fill:#fde68a">120k · aviso</text>
  <text x="580" y="590" class="mono s" style="fill:#a7f3d0">200k · autocompacta</text>
  <text x="856" y="590" class="mono s" text-anchor="end" style="fill:#fecaca">450k · sin tope</text>
  <text x="344" y="590" class="mono s">0</text>
  <text x="344" y="618" class="mono s">sesión larga real: de 68k a 450k tokens por turno</text>

  <!-- rtk -->
  <path d="M880 560H926" stroke="#9aa4c0" stroke-width="1.6" fill="none" marker-start="url(#arr)" stroke-dasharray="4 4"/>
  <rect x="930" y="496" width="210" height="124" rx="12" fill="#0b0f19" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="946" y="522" class="mono h">rtk</text>
  <text x="946" y="544" class="mono t">comprime la salida</text>
  <text x="946" y="562" class="mono t">de Bash antes de</text>
  <text x="946" y="580" class="mono t">entrar al contexto</text>
  <rect x="944" y="592" width="182" height="22" rx="8" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.7"/>
  <text x="1035" y="607" class="mono s" text-anchor="middle" style="fill:#fde68a">60–90 % según su README</text>

  <!-- flechas a agentes -->
  <path d="M540 632V700" stroke="#9aa4c0" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path class="flow" d="M540 632V700" stroke="#34d399" stroke-width="2" fill="none"/>
  <text x="528" y="672" class="mono s" text-anchor="end">Agent × N en UN mensaje</text>
  <path d="M660 700V632" stroke="#fbbf24" stroke-width="2" fill="none" marker-end="url(#arrA)" stroke-dasharray="5 5"/>
  <text x="672" y="672" class="mono s">informes ≤ 25 líneas</text>

  <!-- 4 · SUBAGENTES -->
  <rect x="40" y="704" width="1120" height="214" rx="18" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="64" y="732" class="mono lab">04 · SUBAGENTES</text>
  <text x="226" y="732" class="mono s">lo relacionado en UN agente · lo independiente en paralelo · tope 6 por petición</text>

  <g class="mono">
    <rect x="62" y="748" width="352" height="152" rx="12" fill="#34d399" fill-opacity="0.07" stroke="#34d399" stroke-opacity="0.6"/>
    <circle class="pulse" cx="84" cy="772" r="6" fill="#34d399"/>
    <text x="98" y="777" class="h" style="fill:#a7f3d0">HAIKU</text><text x="404" y="777" class="s" text-anchor="end">lo mecánico · barato</text>
    <text x="78" y="808" class="t">explorador · limpiador · probador</text>
    <text x="78" y="830" class="t">documentador · investigador</text>
    <text x="78" y="862" class="s">leer, buscar, tests, renombres, docs, web</text>
    <text x="78" y="882" class="s">sin tu CLAUDE.md: arranque de ~5–9k tokens</text>

    <rect x="424" y="748" width="352" height="152" rx="12" fill="#fbbf24" fill-opacity="0.07" stroke="#fbbf24" stroke-opacity="0.6"/>
    <circle class="pulse d2" cx="446" cy="772" r="6" fill="#fbbf24"/>
    <text x="460" y="777" class="h" style="fill:#fde68a">SONNET</text><text x="766" y="777" class="s" text-anchor="end">lo normal</text>
    <text x="440" y="808" class="t">especialista · blender · juego</text>
    <text x="440" y="830" class="t">depurador · revisor · verificador</text>
    <text x="440" y="862" class="s">implementar, causa raíz, revisar con PASS/FAIL</text>
    <text x="440" y="882" class="s">el verificador solo si hubo P0/P1 o 3+ archivos</text>

    <rect x="786" y="748" width="352" height="152" rx="12" fill="#f87171" fill-opacity="0.07" stroke="#f87171" stroke-opacity="0.6"/>
    <circle class="pulse d3" cx="808" cy="772" r="6" fill="#f87171"/>
    <text x="822" y="777" class="h" style="fill:#fecaca">OPUS</text><text x="1128" y="777" class="s" text-anchor="end">solo lo difícil · caro</text>
    <text x="802" y="808" class="t">arquitecto</text>
    <text x="802" y="862" class="s">decisiones, bugs tercos, refactors de riesgo</text>
    <text x="802" y="882" class="s">devuelve: recomendación · riesgos · plan</text>
  </g>

  <!-- bucle de aprendizaje: agentes/track -> medir -> route -->
  <path d="M600 918V944" stroke="#9aa4c0" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 5 · MEDIR -->
  <rect x="40" y="948" width="1120" height="48" rx="14" fill="#0b0f19" stroke="#34d399" stroke-opacity="0.45"/>
  <text x="60" y="977" class="mono lab" style="fill:#34d399">05 · MEDIR</text>
  <g class="mono" font-size="12.5" fill="#c3cade">
    <text x="196" y="977">usage.jsonl</text><text x="290" y="977" class="s">·</text>
    <text x="304" y="977">durations.jsonl</text><text x="430" y="977" class="s">·</text>
    <text x="444" y="977">context.jsonl</text>
    <path d="M556 972H600" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
    <text x="612" y="977" style="fill:#a7f3d0">stats · ⏱ estimación · ccusage</text>
  </g>
  <text x="1140" y="977" class="mono s" text-anchor="end" style="fill:#a7f3d0">se afina con tu uso ↺</text>

  <!-- bucle de vuelta a route -->
  <path class="flow" d="M1160 972H1180V348H1168" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrG)" opacity="0.85"/>
  <text x="1192" y="700" class="mono s" transform="rotate(-90 1192 700)" text-anchor="middle" style="fill:#a7f3d0">el historial afina el ⏱ de route</text>
</svg>
