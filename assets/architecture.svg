<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="Cómo funciona claudeop: 1 tú pides, 2 Claude decide, 3 los ayudantes Haiku, Sonnet y Opus trabajan, 4 te cuenta el resultado. Unos vigilantes protegen, limitan, vigilan el contexto y miden.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f19"/><stop offset="1" stop-color="#14102a"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="0.5" stop-color="#fbbf24"/><stop offset="1" stop-color="#f87171"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
    <style>
      .sans { font-family: -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
      .mono { font-family: 'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace; }
      .flow { stroke-dasharray: 7 8; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -30; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      .card { fill: #0f1424; stroke: #ffffff; stroke-opacity: .16; }
      .tt { font-size: 24px; font-weight: 800; fill: #f4f6fb; }
      .bd { font-size: 18px; fill: #c9d0e3; }
      .tag { font-size: 15px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="690" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="690" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="688" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>

  <text x="50" y="68" class="sans" font-size="40" font-weight="800" fill="url(#title)">Así funciona</text>
  <text x="50" y="102" class="sans" font-size="20" fill="#aab3cc">Tú pides · Claude reparte · los ayudantes trabajan · todo se vigila y se mide</text>

  <!-- flechas -->
  <g stroke="#34d399" stroke-width="3" fill="none" marker-end="url(#arr)">
    <path d="M292 270H334"/><path d="M582 270H624"/><path d="M872 270H914"/>
  </g>
  <g stroke="#34d399" stroke-width="3" fill="none" class="flow" opacity=".9">
    <path d="M292 270H334"/><path d="M582 270H624"/><path d="M872 270H914"/>
  </g>

  <!-- 1 · TÚ -->
  <rect class="card" x="50" y="140" width="240" height="260" rx="18"/>
  <circle cx="86" cy="180" r="19" fill="#38bdf8"/><text x="86" y="187" class="sans" font-size="21" font-weight="800" fill="#06101c" text-anchor="middle">1</text>
  <text x="118" y="188" class="sans tt">Tú</text>
  <text x="70" y="244" class="sans bd">Escribes lo que quieres,</text>
  <text x="70" y="272" class="sans bd">como se lo dirías a</text>
  <text x="70" y="300" class="sans bd">una persona.</text>
  <rect x="68" y="340" width="204" height="40" rx="10" fill="#38bdf8" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".6"/>
  <text x="170" y="366" class="sans tag" fill="#bae6fd" text-anchor="middle">sin comandos</text>

  <!-- 2 · CLAUDE -->
  <rect class="card" x="340" y="140" width="240" height="260" rx="18" style="stroke:#fbbf24;stroke-opacity:.6"/>
  <circle cx="376" cy="180" r="19" fill="#fbbf24"/><text x="376" y="187" class="sans" font-size="21" font-weight="800" fill="#1c1303" text-anchor="middle">2</text>
  <text x="408" y="188" class="sans tt">Claude</text>
  <text x="360" y="244" class="sans bd">Entiende la tarea,</text>
  <text x="360" y="272" class="sans bd">elige el método y</text>
  <text x="360" y="300" class="sans bd">decide a quién le toca</text>
  <text x="360" y="328" class="sans bd">cada parte.</text>
  <rect x="358" y="346" width="204" height="40" rx="10" fill="#fbbf24" fill-opacity=".14" stroke="#fbbf24" stroke-opacity=".6"/>
  <text x="460" y="372" class="sans tag" fill="#fde68a" text-anchor="middle">⏱ te dice cuánto tarda</text>

  <!-- 3 · AYUDANTES -->
  <rect class="card" x="630" y="140" width="240" height="260" rx="18"/>
  <circle cx="666" cy="180" r="19" fill="#a78bfa"/><text x="666" y="187" class="sans" font-size="21" font-weight="800" fill="#0d0720" text-anchor="middle">3</text>
  <text x="698" y="188" class="sans tt">Ayudantes</text>
  <g class="sans">
    <rect x="646" y="212" width="208" height="54" rx="12" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".7"/>
    <circle class="pulse" cx="668" cy="239" r="7" fill="#34d399"/>
    <text x="684" y="236" font-size="18" font-weight="800" fill="#a7f3d0">Haiku</text><text x="684" y="256" font-size="14" fill="#8fd9bb">lo fácil · barato</text>
    <rect x="646" y="274" width="208" height="54" rx="12" fill="#fbbf24" fill-opacity=".14" stroke="#fbbf24" stroke-opacity=".7"/>
    <circle class="pulse" cx="668" cy="301" r="7" fill="#fbbf24" style="animation-delay:.8s"/>
    <text x="684" y="298" font-size="18" font-weight="800" fill="#fde68a">Sonnet</text><text x="684" y="318" font-size="14" fill="#e6cd7a">lo normal</text>
    <rect x="646" y="336" width="208" height="54" rx="12" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".7"/>
    <circle class="pulse" cx="668" cy="363" r="7" fill="#f87171" style="animation-delay:1.6s"/>
    <text x="684" y="360" font-size="18" font-weight="800" fill="#fecaca">Opus</text><text x="684" y="380" font-size="14" fill="#eba5a5">solo lo difícil · caro</text>
  </g>

  <!-- 4 · RESULTADO -->
  <rect class="card" x="920" y="140" width="240" height="260" rx="18"/>
  <circle cx="956" cy="180" r="19" fill="#34d399"/><text x="956" y="187" class="sans" font-size="21" font-weight="800" fill="#04140d" text-anchor="middle">4</text>
  <text x="988" y="188" class="sans tt">Resultado</text>
  <text x="940" y="244" class="sans bd">Te lo cuenta en pocas</text>
  <text x="940" y="272" class="sans bd">líneas, lo comprueba</text>
  <text x="940" y="300" class="sans bd">y te avisa cuando</text>
  <text x="940" y="328" class="sans bd">termina.</text>
  <rect x="938" y="346" width="204" height="40" rx="10" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".6"/>
  <text x="1040" y="372" class="sans tag" fill="#a7f3d0" text-anchor="middle">🔔 aviso al acabar</text>

  <!-- vigilantes -->
  <rect x="50" y="440" width="1110" height="216" rx="20" fill="#34d399" fill-opacity=".05" stroke="#34d399" stroke-opacity=".45" stroke-dasharray="3 7"/>
  <text x="76" y="480" class="sans" font-size="22" font-weight="800" fill="#a7f3d0">Los vigilantes</text>
  <text x="236" y="480" class="sans" font-size="17" fill="#8aa3b0">miran cada paso de arriba · son scripts pequeños, no usan IA y no gastan tokens</text>

  <g class="sans">
    <rect class="card" x="70" y="504" width="250" height="134" rx="14"/>
    <text x="90" y="540" font-size="21" font-weight="800" fill="#fecaca">Protegen</text>
    <text x="90" y="574" font-size="17" fill="#c9d0e3">Piden permiso antes</text>
    <text x="90" y="598" font-size="17" fill="#c9d0e3">de git push o de</text>
    <text x="90" y="622" font-size="17" fill="#c9d0e3">borrar en grande.</text>

    <rect class="card" x="338" y="504" width="250" height="134" rx="14"/>
    <text x="358" y="540" font-size="21" font-weight="800" fill="#fde68a">Limitan</text>
    <text x="358" y="574" font-size="17" fill="#c9d0e3">Máximo 6 ayudantes</text>
    <text x="358" y="598" font-size="17" fill="#c9d0e3">a la vez; lo parecido</text>
    <text x="358" y="622" font-size="17" fill="#c9d0e3">va con el mismo.</text>

    <rect class="card" x="606" y="504" width="250" height="134" rx="14"/>
    <text x="626" y="540" font-size="21" font-weight="800" fill="#bae6fd">Vigilan el contexto</text>
    <text x="626" y="574" font-size="17" fill="#c9d0e3">Avisan a los 120k</text>
    <text x="626" y="598" font-size="17" fill="#c9d0e3">tokens y se compacta</text>
    <text x="626" y="622" font-size="17" fill="#c9d0e3">solo al llegar a 200k.</text>

    <rect class="card" x="874" y="504" width="266" height="134" rx="14"/>
    <text x="894" y="540" font-size="21" font-weight="800" fill="#a7f3d0">Miden</text>
    <text x="894" y="574" font-size="17" fill="#c9d0e3">Anotan lo que gastas</text>
    <text x="894" y="598" font-size="17" fill="#c9d0e3">y lo que tardas para</text>
    <text x="894" y="622" font-size="17" fill="#c9d0e3">afinar la estimación.</text>
  </g>
</svg>
